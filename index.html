<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { CSS3DRenderer, CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";
import { FallingDevices } from "./FallingDevices.js";

/* ============================================================
   SHARED VOID STAGE
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060708);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 200);
const OVERVIEW_POS = new THREE.Vector3(0, 2, 27);
const OVERVIEW_TGT = new THREE.Vector3(0, 2, 0);
camera.position.copy(OVERVIEW_POS);
camera.lookAt(OVERVIEW_TGT);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

/* DOM overlay layer: hosts the solitaire game as a live page mapped
   onto the CRT screen. Click-through everywhere except the game. */
const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(innerWidth, innerHeight);
cssRenderer.domElement.style.position = "fixed";
cssRenderer.domElement.style.top = "0";
cssRenderer.domElement.style.left = "0";
cssRenderer.domElement.style.pointerEvents = "none";
cssRenderer.domElement.style.zIndex = "5";
document.body.appendChild(cssRenderer.domElement);

/* Soft studio illumination, no visible fixtures — union of the three original rigs */
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x0a0c10, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.3);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
/* wide shadow frustum — the pile is tall */
keyLight.shadow.camera.left = -12; keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12; keyLight.shadow.camera.bottom = -12;
keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 40;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x9db8ff, 2.3);
rimLight.position.set(-5, 3.5, -6);
scene.add(rimLight);
const warm = new THREE.PointLight(0xffb477, 10, 14);
warm.position.set(5, 0.5, 4);
scene.add(warm);
const underFill = new THREE.DirectionalLight(0x3a4356, 0.6);
underFill.position.set(0, -4, 2);
scene.add(underFill);

/* Reused temps — never allocate inside the loop */
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3();
const _ray = new THREE.Raycaster(), _ptr = new THREE.Vector2();

/* ============================================================
   DEVICE 1 — CRT MONITOR (geometry / materials / OS preserved)
   ============================================================ */
function buildCRT(){
  const group = new THREE.Group();
  const plastic = new THREE.MeshStandardMaterial({color:0xb7aa89,roughness:.72});
  const plasticShadow = new THREE.MeshStandardMaterial({color:0x867c64,roughness:.8});
  const darkPlastic = new THREE.MeshStandardMaterial({color:0x35342f,roughness:.8});
  const black = new THREE.MeshStandardMaterial({color:0x080909,roughness:.6});
  const ledOn = new THREE.MeshStandardMaterial({color:0x9fc987,emissive:0x76ff5c,emissiveIntensity:4});
  const ledOff = new THREE.MeshStandardMaterial({color:0x331111,emissive:0x220000,emissiveIntensity:1});
  function add(mesh,x=0,y=0,z=0){mesh.position.set(x,y,z);
    mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);return mesh;}

  add(new THREE.Mesh(new RoundedBoxGeometry(5.6,4.4,2.7,8,.28),plastic));
  const back = add(new THREE.Mesh(new RoundedBoxGeometry(4.7,3.65,3.3,8,.42),plastic),0,.1,-1.35);
  back.scale.set(.9,.9,1);
  add(new THREE.Mesh(new RoundedBoxGeometry(3.55,2.65,.4,6,.24),plasticShadow),0,.15,-3.05);
  add(new THREE.Mesh(new RoundedBoxGeometry(5.25,4.05,.32,8,.26),plastic),0,0,1.46);
  add(new THREE.Mesh(new RoundedBoxGeometry(4.35,3.05,.3,8,.28),darkPlastic),-0.18,.25,1.65);

  const scrCanvas = document.createElement("canvas"); scrCanvas.width=640; scrCanvas.height=480;
  const g = scrCanvas.getContext("2d");
  const scrTex = new THREE.CanvasTexture(scrCanvas);
  scrTex.colorSpace = THREE.SRGBColorSpace;
  const display = new THREE.Mesh(new THREE.PlaneGeometry(3.5,2.45),
    new THREE.MeshBasicMaterial({map:scrTex,toneMapped:false}));
  display.position.set(-0.18,.25,1.82); group.add(display);

  add(new THREE.Mesh(new RoundedBoxGeometry(4.2,.47,.19,6,.07),plasticShadow),.15,-1.65,1.65);
  const powerButton = add(new THREE.Mesh(new RoundedBoxGeometry(.48,.3,.22,4,.045),darkPlastic),1.75,-1.65,1.81);
  const led = new THREE.Mesh(new THREE.SphereGeometry(.065,20,20),ledOn);
  led.position.set(1.35,-1.65,1.81); group.add(led);

  for(const s of [-1,1]) for(let i=0;i<9;i++){
    const v=new THREE.Mesh(new THREE.BoxGeometry(.035,.09,1.35),black);
    v.position.set(s*2.81,1.15-i*.22,-.35); group.add(v);
  }
  for(let i=0;i<12;i++){
    const v=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,1.1),black);
    v.position.set(-1.3+i*.24,2.215,-.6); group.add(v);
  }
  add(new THREE.Mesh(new RoundedBoxGeometry(1.45,.85,1.25,6,.18),plastic),0,-2.55,-.1);
  add(new THREE.Mesh(new RoundedBoxGeometry(3.7,.42,2.6,8,.18),plastic),0,-3.08,.05);

  /* Below the game overlay sits a working retro desktop: teal field,
     taskbar with begin menu, rx.pdf reader, trash. The solitaire
     icon reopens the game after it is closed. */
  const S = {power:true, bootT:0, ready:false, pdfOpen:false, pdfScroll:0, menuOpen:false, gameOpen:true,
    cursor:{x:320,y:240}, cursorActive:false};
  const FILE_HIT = {x:262,y:180,w:116,h:130};
  const SOL_HIT = {x:496,y:180,w:120,h:130};
  const BEGIN_HIT = {x:4,y:446,w:90,h:30};
  const MENU = {x:4,y:356,w:172,h:90};
  function drawScreen(t){
    const W=640,H=480;
    const arrow=()=>{
      if(!S.cursorActive) return;
      const cx=S.cursor.x, cy=S.cursor.y;
      g.fillStyle="#fff";g.strokeStyle="#000";g.lineWidth=2;
      g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,cy+17);g.lineTo(cx+5,cy+13);
      g.lineTo(cx+7,cy+18);g.lineTo(cx+9,cy+16);g.lineTo(cx+7,cy+11);
      g.lineTo(cx+12,cy+11);g.closePath();g.fill();g.stroke();
    };
    g.fillStyle="#0b0b0c";g.fillRect(0,0,W,H);
    if(!S.power){arrow();scrTex.needsUpdate=true;return;}
    const desk=g.createLinearGradient(0,0,0,H);
    desk.addColorStop(0,"#0e8282");desk.addColorStop(1,"#075e5e");
    g.fillStyle=desk;g.fillRect(0,0,W,H);
    if(!S.ready){
      g.fillStyle="rgba(255,255,255,.75)";g.font="14px Tahoma,system-ui,sans-serif";
      g.textBaseline="alphabetic";
      g.fillText("please wait…",W/2-44,H/2);
      arrow();
      scrTex.needsUpdate=true;return;
    }
    g.textBaseline="alphabetic";
    /* desktop icon: rx.pdf file */
    const fx=298,fy=198;
    g.fillStyle="#f4f4f0";
    g.beginPath();
    g.moveTo(fx,fy);g.lineTo(fx+32,fy);g.lineTo(fx+44,fy+12);g.lineTo(fx+44,fy+56);
    g.lineTo(fx,fy+56);g.closePath();g.fill();
    g.fillStyle="#c9c9c4";
    g.beginPath();
    g.moveTo(fx+32,fy);g.lineTo(fx+32,fy+12);g.lineTo(fx+44,fy+12);g.closePath();g.fill();
    g.fillStyle="#a33d3d";g.fillRect(fx,fy+34,44,13);
    g.fillStyle="#fff";g.font="bold 10px Tahoma,system-ui,sans-serif";
    g.fillText("PDF",fx+11,fy+44);
    g.fillStyle="#fff";g.font="12px Tahoma,system-ui,sans-serif";
    g.fillText("rx.pdf",fx-1,fy+72);
    /* trash icon, decorative */
    g.fillStyle="#c9c9c4";g.fillRect(48,204,28,30);
    g.fillStyle="#8f8f8a";g.fillRect(48,204,28,5);
    g.fillStyle="#fff";g.font="12px Tahoma,system-ui,sans-serif";
    g.fillText("trash",46,246);
    /* solitaire icon: green felt + white card, reopens the game */
    g.fillStyle="#0d4f2a";g.fillRect(516,198,52,44);
    g.strokeStyle="rgba(255,255,255,.5)";g.lineWidth=1;
    g.strokeRect(516.5,198.5,51,43);
    g.fillStyle="#f4f4f0";g.fillRect(528,204,28,32);
    g.fillStyle="#a33d3d";g.font="bold 16px Georgia,serif";
    g.fillText("A",534,228);
    g.fillStyle="#fff";g.font="12px Tahoma,system-ui,sans-serif";
    g.fillText("solitaire",508,258);
    if(S.pdfOpen){
      const px=170,py=44,pw=300,ph=392;
      g.fillStyle="#d4d0c8";g.fillRect(px-3,py-3,pw+6,ph+6);
      const tb=g.createLinearGradient(px,0,px+pw,0);
      tb.addColorStop(0,"#000080");tb.addColorStop(1,"#1084d0");
      g.fillStyle=tb;g.fillRect(px,py,pw,28);
      g.fillStyle="#fff";g.font="bold 14px Tahoma,system-ui,sans-serif";
      g.fillText("rx.pdf — reader",px+8,py+20);
      g.fillStyle="#d4d0c8";g.fillRect(426,48,44,36);
      g.fillStyle="#fff";g.fillRect(426,48,44,2);
      g.fillStyle="#808080";g.fillRect(426,82,44,2);
      g.fillStyle="#404040";g.font="bold 18px Tahoma,system-ui,sans-serif";
      g.fillText("×",442,76);
      g.fillStyle="#d4d0c8";g.fillRect(px,py+28,pw,20);
      g.fillStyle="#222";g.font="12px Tahoma,system-ui,sans-serif";
      g.fillText("File   Edit   View",px+8,py+43);
      g.fillStyle="#fff";g.fillRect(px,py+48,pw,ph-48);
      g.save();g.beginPath();g.rect(px,py+48,pw,ph-48);g.clip();
      g.translate(0,-S.pdfScroll);
      g.fillStyle="#1a1a1c";g.font="600 24px Georgia,serif";
      g.fillText("rx",px+32,py+108);
      g.fillStyle="#c9c5bb";g.fillRect(px+32,py+124,pw-64,1);
      g.fillStyle="#55555a";g.font="15px Georgia,serif";
      g.fillText("This file is intentionally quiet.",px+32,py+168);
      g.fillText("There is nothing else",px+32,py+194);
      g.fillText("on this computer.",px+32,py+220);
      g.fillStyle="#c4c0b5";
      for(let i=0;i<4;i++)g.fillRect(px+32,py+248+i*24,pw-64-((i*53)%120),8);
      g.fillStyle="#55555a";g.font="13px system-ui,sans-serif";
      g.fillText("— end of file —",px+32,py+378);
      g.restore();
    }
    /* taskbar */
    g.fillStyle="#d4d0c8";g.fillRect(0,H-34,W,34);
    g.fillStyle="#ffffff";g.fillRect(0,H-34,W,2);
    const bg=g.createLinearGradient(0,H-30,0,H-4);
    bg.addColorStop(0,"#3f9e4d");bg.addColorStop(1,"#2c7a38");
    g.fillStyle=bg;g.fillRect(4,H-30,90,26);
    g.fillStyle="#fff";g.font="bold 15px Tahoma,system-ui,sans-serif";
    g.fillText("begin",22,H-11);
    g.fillStyle="#e8e8e8";g.fillRect(10,H-25,14,14);
    g.fillStyle="#3f9e4d";g.fillRect(12,H-23,10,4);
    g.fillStyle="#d4a017";g.fillRect(12,H-18,10,4);
    if(S.pdfOpen){
      g.fillStyle="#b8b4ac";g.fillRect(100,H-30,180,26);
      g.fillStyle="#222";g.font="12px Tahoma,system-ui,sans-serif";
      g.fillText("rx.pdf — reader",108,H-12);
    }
    if(S.gameOpen){
      g.fillStyle="#b8b4ac";g.fillRect(286,H-30,180,26);
      g.fillStyle="#222";g.font="12px Tahoma,system-ui,sans-serif";
      g.fillText("solitaire",294,H-12);
    }
    g.fillStyle="#b8b4ac";g.fillRect(W-92,H-30,88,26);
    g.fillStyle="#222";g.font="12px Tahoma,system-ui,sans-serif";
    g.fillText(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),W-80,H-12);
    if(S.menuOpen){
      g.fillStyle="#d4d0c8";g.fillRect(MENU.x,MENU.y,MENU.w,MENU.h);
      g.fillStyle="#fff";g.fillRect(MENU.x,MENU.y,MENU.w,2);
      g.fillStyle="#222";g.font="13px Tahoma,system-ui,sans-serif";
      g.fillText("reader",MENU.x+12,MENU.y+26);
      g.fillStyle="#808080";g.fillRect(MENU.x+4,MENU.y+44,MENU.w-8,1);
      g.fillText("shut down",MENU.x+12,MENU.y+72);
    }
    arrow();
    scrTex.needsUpdate=true;
  }
  function clickOS(px,py){
    if(!S.ready||!S.power) return;
    const inBegin=px>BEGIN_HIT.x&&px<BEGIN_HIT.x+BEGIN_HIT.w&&py>BEGIN_HIT.y&&py<BEGIN_HIT.y+BEGIN_HIT.h;
    if(S.menuOpen){
      if(px>MENU.x+4&&px<MENU.x+MENU.w-4&&py>MENU.y+4&&py<MENU.y+40){
        S.menuOpen=false;S.pdfOpen=true;S.pdfScroll=0;S.gameOpen=false;return;
      }
      if(px>MENU.x+4&&px<MENU.x+MENU.w-4&&py>MENU.y+48&&py<MENU.y+82){
        S.menuOpen=false;togglePower();return;
      }
      S.menuOpen=false;
      if(inBegin) return;
    }else if(inBegin){ S.menuOpen=true; return; }
    if(S.pdfOpen){
      if(px>426&&px<470&&py>44&&py<88){S.pdfOpen=false;S.pdfScroll=0;}
      return;
    }
    if(px>SOL_HIT.x&&px<SOL_HIT.x+SOL_HIT.w&&py>SOL_HIT.y&&py<SOL_HIT.y+SOL_HIT.h){
      S.pdfOpen=false;S.pdfScroll=0;S.menuOpen=false;S.gameOpen=true;return;
    }
    if(px>FILE_HIT.x&&px<FILE_HIT.x+FILE_HIT.w&&py>FILE_HIT.y&&py<FILE_HIT.y+FILE_HIT.h){
      S.pdfOpen=true;S.pdfScroll=0;S.gameOpen=false;
    }
  }
  function togglePower(){
    S.power=!S.power; S.bootT=0; S.ready=false; S.pdfOpen=false; S.pdfScroll=0; S.menuOpen=false;
    led.material=S.power?ledOn:ledOff;
    powerButton.position.z-= .06; setTimeout(()=>powerButton.position.z+=.06,120);
  }
  return {group, display, powerButton, S, drawScreen, clickOS, togglePower,
    screenW:3.5, screenH:2.45};
}

/* ============================================================
   DEVICE 2 — LAPTOP (geometry / keyboard / Ryann OS preserved)
   ============================================================ */
function buildLaptop(){
  const laptop = new THREE.Group();
  const LAPTOP_BASE_ROT = THREE.MathUtils.degToRad(-18);
  laptop.rotation.y = LAPTOP_BASE_ROT;

  const aluminum = new THREE.MeshStandardMaterial({color:0xb8babd,metalness:.8,roughness:.28});
  const darkAlu = new THREE.MeshStandardMaterial({color:0x303236,metalness:.7,roughness:.32});
  const blackMat = new THREE.MeshStandardMaterial({color:0x090909,roughness:.32,metalness:.15});
  const keyMatBase = new THREE.MeshStandardMaterial({color:0x191919,roughness:.55});

  const OS_W=1024, OS_H=560;
  const osCanvas=document.createElement("canvas");
  osCanvas.width=OS_W; osCanvas.height=OS_H;
  const ctx=osCanvas.getContext("2d");
  const osTex=new THREE.CanvasTexture(osCanvas);
  osTex.colorSpace=THREE.SRGBColorSpace;
  osTex.anisotropy=8;

  const ICON={x:70,y:70,w:100,h:122};
  let WIN={x:142,y:48,w:740,h:464};
  const TITLE_H=40;
  let selected=false, windowOpen=false;
  let cursor={x:512,y:300}, cursorActive=false;
  let pdfScroll=0, typedBuffer="", typedUntil=0;
  let lastVirtualClick=0;

  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function drawOS(){
    const now=performance.now();
    /* unbranded dark workstation: deep indigo field, near-black top bar */
    const g=ctx.createLinearGradient(0,0,OS_W,OS_H);
    g.addColorStop(0,"#232b45");g.addColorStop(.55,"#161b2e");g.addColorStop(1,"#0b0e18");
    ctx.fillStyle=g;ctx.fillRect(0,0,OS_W,OS_H);
    /* faint terminal-grid texture */
    ctx.fillStyle="rgba(120,160,255,.045)";
    for(let gx=0;gx<OS_W;gx+=32)ctx.fillRect(gx,32,1,OS_H-32);
    for(let gy=32;gy<OS_H;gy+=32)ctx.fillRect(0,gy,OS_W,1);
    ctx.fillStyle="#0a0c11";ctx.fillRect(0,0,OS_W,32);
    ctx.fillStyle="#e8eaf0";ctx.font="600 14px system-ui";ctx.textBaseline="middle";
    ctx.fillText("ryann",14,17);
    ctx.fillStyle="#8b93a7";ctx.font="14px system-ui";
    ctx.fillText("desktop",72,17);
    ctx.textAlign="right";
    ctx.fillStyle="#c9cfdd";
    ctx.fillText(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+"   100%",OS_W-14,17);
    ctx.textAlign="left";
    const ix=ICON.x,iy=ICON.y;
    if(selected){ctx.fillStyle="rgba(90,140,255,.35)";rr(ix-10,iy-8,ICON.w+20,ICON.h+22,12);ctx.fill();}
    ctx.fillStyle="#dfe3ec";ctx.strokeStyle="rgba(0,0,0,.5)";
    ctx.beginPath();ctx.moveTo(ix+10,iy);ctx.lineTo(ix+70,iy);ctx.lineTo(ix+86,iy+16);
    ctx.lineTo(ix+86,iy+84);ctx.lineTo(ix+10,iy+84);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#b02a37";ctx.fillRect(ix+10,iy+52,76,22);
    ctx.fillStyle="#fff";ctx.font="bold 13px system-ui";ctx.fillText("PDF",ix+32,iy+64);
    ctx.fillStyle="#e8eaf0";ctx.font="13px system-ui";ctx.textAlign="center";
    ctx.fillText("rx.pdf",ix+48,iy+102);ctx.textAlign="left";
    if(typedBuffer && now<typedUntil){
      ctx.fillStyle="rgba(5,8,12,.92)";rr(OS_W/2-180,OS_H-52,360,34,17);ctx.fill();
      ctx.strokeStyle="rgba(74,222,128,.4)";rr(OS_W/2-180,OS_H-52,360,34,17);ctx.stroke();
      ctx.fillStyle="#4ade80";ctx.font="15px ui-monospace,monospace";ctx.textAlign="center";
      ctx.fillText("$ "+typedBuffer.slice(-28)+"_",OS_W/2,OS_H-34);ctx.textAlign="left";
    }
    if(windowOpen){
      ctx.save();ctx.shadowColor="rgba(0,0,0,.6)";ctx.shadowBlur=30;ctx.shadowOffsetY=10;
      ctx.fillStyle="#161a23";rr(WIN.x,WIN.y,WIN.w,WIN.h,12);ctx.fill();ctx.restore();
      ctx.save();rr(WIN.x,WIN.y,WIN.w,WIN.h,12);ctx.clip();
      ctx.fillStyle="#232936";ctx.fillRect(WIN.x,WIN.y,WIN.w,TITLE_H);
      ctx.strokeStyle="#3a4152";ctx.beginPath();
      ctx.moveTo(WIN.x,WIN.y+TITLE_H+.5);ctx.lineTo(WIN.x+WIN.w,WIN.y+TITLE_H+.5);ctx.stroke();
      ctx.fillStyle="#e0605e";ctx.beginPath();ctx.arc(WIN.x+26,WIN.y+20,10,0,7);ctx.fill();
      ctx.fillStyle="#1a0d0d";ctx.font="bold 12px system-ui";ctx.textAlign="center";
      ctx.fillText("x",WIN.x+26,WIN.y+21);ctx.textAlign="left";
      ctx.fillStyle="#3a4152";ctx.beginPath();ctx.arc(WIN.x+48,WIN.y+20,8,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(WIN.x+66,WIN.y+20,8,0,7);ctx.fill();
      ctx.fillStyle="#aab2c5";ctx.font="13px ui-monospace,monospace";ctx.textAlign="center";

  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.26,0.014,10,48),bronze);
  ring.position.set(1.85,2.78,1.06); tv.add(ring);

  add(new THREE.Mesh(new RoundedBoxGeometry(5.2,0.55,0.12,4,.03),trimWood),0,0.98,0.80);
  const speaker = new THREE.Mesh(new THREE.PlaneGeometry(4.85,0.36),
    new THREE.MeshStandardMaterial({map:speakerTex,roughness:.9}));
  speaker.position.set(0,0.98,0.87); tv.add(speaker);
  add(new THREE.Mesh(new THREE.BoxGeometry(5.0,0.02,0.01),bronze),0,0.98,0.875);

  const hump = add(new THREE.Mesh(new RoundedBoxGeometry(3.2,2.0,1.1,5,.3),darkWood),-0.7,2.1,-0.9);
  hump.scale.set(1,1,1);

  function sideHandle(x){
    const g2=new THREE.Group();
    for(const dy of [0.12,-0.12]){
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.28,12),bronze);
      p.rotation.z=Math.PI/2; p.position.y=dy; g2.add(p);
    }
    const bridge=new THREE.Mesh(new THREE.TorusGeometry(0.12,0.025,10,24,Math.PI),bronze);
    bridge.rotation.z=Math.PI/2; bridge.position.x = x>0?-0.08:0.08; g2.add(bridge);
    g2.position.set(x,2.3,0.8); tv.add(g2);
  }
  sideHandle(-2.72); sideHandle(2.72);

  function makeLeg(x,z,tiltX,tiltZ){
    const g2=new THREE.Group();
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.032,1.25,10),wood);
    leg.position.y=-0.55; leg.castShadow=true; g2.add(leg);
    const ferrule=new THREE.Mesh(new THREE.CylinderGeometry(0.034,0.034,0.12,12),bronze);
    ferrule.position.y=-1.16; g2.add(ferrule);
    const foot=new THREE.Mesh(new THREE.SphereGeometry(0.034,12,12),blackMetal);
    foot.position.y=-1.23; g2.add(foot);
    g2.position.set(x,0.55,z);
    g2.rotation.z=tiltZ; g2.rotation.x=tiltX;
    tv.add(g2);
  }
  makeLeg(-2.55, 0.5, -0.12, -0.16);
  makeLeg( 2.55, 0.5, -0.12,  0.16);
  makeLeg(-2.45,-0.5,  0.12, -0.12);
  makeLeg( 2.45,-0.5,  0.12,  0.12);
  const stretcher = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,4.8,8),darkWood);
  stretcher.rotation.z=Math.PI/2; stretcher.position.set(0,-0.35,-0.72); stretcher.castShadow=true;
  tv.add(stretcher);

  add(new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.19,0.16,24),blackMetal),0.05,3.63,-0.02);
  add(new THREE.Mesh(new THREE.SphereGeometry(0.09,20,20),bronze),0.05,3.73,-0.02);
  function cylinderBetween(a,b,r){
    const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,a.distanceTo(b),8),antennaMat);
    m.position.copy(mid);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3().subVectors(b,a).normalize());
    m.castShadow=true; tv.add(m); return m;
  }
  const joint=new THREE.Vector3(0.05,3.76,-0.02);
  const leftTip=new THREE.Vector3(-1.15,6.1,-0.1);
  const rightTip=new THREE.Vector3(1.75,5.55,-0.1);
  cylinderBetween(joint,leftTip,0.012);
  cylinderBetween(joint,rightTip,0.012);
  for(const p of [leftTip,rightTip]){
    const tip=new THREE.Mesh(new THREE.SphereGeometry(0.026,10,10),antennaMat);
    tip.position.copy(p); tv.add(tip);
  }
  const coilCurve=new THREE.CatmullRomCurve3(Array.from({length:42},(_,i)=>{
    const t=i/41, turns=t*Math.PI*12;
    return new THREE.Vector3(0.05+Math.cos(turns)*0.055, 3.84+t*0.7, 0.0+Math.sin(turns)*0.055);
  }));
  tv.add(new THREE.Mesh(new THREE.TubeGeometry(coilCurve,100,0.008,6,false),antennaMat));

  let powered=true; /* the set never turns off — static from the first frame */
  function drawStatic(){
    const w=staticCanvas.width,h=staticCanvas.height;
    const img=sctx.createImageData(w,h);
    if(!powered){
      for(let i=0;i<img.data.length;i+=4){img.data[i]=40;img.data[i+1]=48;img.data[i+2]=41;img.data[i+3]=255;}
    }else{
      for(let i=0;i<img.data.length;i+=4){
        const n=Math.random()*160+45;
        img.data[i]=n*0.86;img.data[i+1]=n*0.95;img.data[i+2]=n*0.84;img.data[i+3]=255;
      }
      for(let y=0;y<h;y+=4) for(let x=0;x<w;x++){
        const idx=(y*w+x)*4; img.data[idx]*=0.7;img.data[idx+1]*=0.7;img.data[idx+2]*=0.7;
      }
    }
    sctx.putImageData(img,0,0);
    staticTex.needsUpdate=true;
    screenInnerMaterial.emissiveIntensity = powered?1.35:0.12;
  }
  drawStatic();
  function togglePower(){
    powered=!powered;
    powerDial.rotation.z+=Math.PI*0.34;
    drawStatic();
  }
  return {group:tv, innerScreen, glass, powerDial, drawStatic, togglePower,
    screenW:2.85, screenH:1.78, screenMat:screenInnerMaterial,
    get powered(){return powered;}};
}

/* ============================================================
   ASSEMBLE — devices under one physics controller
   ============================================================ */
const crt = buildCRT();
const lap = buildLaptop();
const tvd = buildTV();

const crtFlight = new THREE.Group(); crtFlight.add(crt.group); scene.add(crtFlight);
const lapFlight = new THREE.Group(); lapFlight.add(lap.group); scene.add(lapFlight);
const tvFlight  = new THREE.Group(); tvFlight.add(tvd.group);
/* True-to-life scale hierarchy, staged not remodeled:
   console TV biggest, CRT middle, laptop smallest. */
const CRT_S = 0.72, LAP_S = 0.50, TV_S = 1.0;
crt.group.scale.setScalar(CRT_S);
lap.group.scale.setScalar(LAP_S);
tvd.group.scale.setScalar(TV_S);
tvd.group.position.y = -0.55;
scene.add(tvFlight);
/* hidden until Rapier boots and spawns them — the void starts empty */
crtFlight.visible = false; lapFlight.visible = false; tvFlight.visible = false;

/* Solitaire overlay: the actual game page, mapped 1:1 onto the CRT
   screen quad. Lives inside the monitor group so it rides the fall.
   Hidden until the desktop icon opens it; the × in its corner closes. */
const gameDiv = document.createElement("div");
gameDiv.style.width = "640px";
gameDiv.style.height = "480px";
gameDiv.style.position = "relative";
gameDiv.style.pointerEvents = "none"; /* click-through until focused */
gameDiv.style.overflow = "hidden";
const gameFrame = document.createElement("iframe");
gameFrame.src = "solitaire-win2000.html";
gameFrame.style.width = "640px";
gameFrame.style.height = "480px";
gameFrame.style.border = "0";
gameFrame.style.display = "block";
gameDiv.appendChild(gameFrame);
const gameClose = document.createElement("button");
gameClose.textContent = "×";
gameClose.setAttribute("aria-label", "close solitaire");
gameClose.style.cssText = "position:absolute;top:6px;right:8px;width:26px;height:24px;" +
  "border:1px solid #6f7f8c;border-radius:3px;cursor:pointer;" +
  "background:linear-gradient(#ffffff,#d9e2ea);color:#111;font:14px/1 Tahoma,sans-serif;";
gameClose.addEventListener("click", ()=>{ crt.S.gameOpen = false; });
gameDiv.appendChild(gameClose);
const gameObj = new CSS3DObject(gameDiv);
gameObj.scale.set(3.5/640, 2.45/480, 1);
gameObj.position.set(-0.18, 0.25, 1.826);
gameObj.visible = false;
crt.group.add(gameObj);

/* Collider quats in flight space (account for inner offsets:
   laptop base yaw -18°, lid = yaw(-18°) * tilt(-12°)). */
const _ce = new THREE.Euler(), _cq = new THREE.Quaternion();
function Q(x, y, z, order){
  _ce.set(x, y, z, order || "XYZ");
  _cq.setFromEuler(_ce);
  return [_cq.x, _cq.y, _cq.z, _cq.w];
}
const D2R = THREE.MathUtils.degToRad;
const IDENT_Q = [0, 0, 0, 1];

const falling = new FallingDevices({ scene, camera, renderer });
/* The drop: staggered slots down an empty shaft. The TV drops hard
   and runs ahead; CRT drifts in the middle; laptop floats last and
   slowest. Wide x separation so they never pile — the space between
   them is the composition. Small tilts, slow rotation, no floor. */
falling.init([
  {
    name: "tv", object: tvFlight,
    delay: 0,
    position: { x: 0.5, y: 15.5, z: 0 },
    rotation: { x: D2R(3), y: D2R(-4), z: D2R(2) },
    velocity: { x: 0, y: -1, z: 0 },
    angularVelocity: { x: 0.15, y: 0.10, z: -0.12 },
    mass: 30, dropDamp: 3.0, dropG: 1.35, fallDamp: 13,
    colliders: [
      { h: [2.95, 1.5, 0.85], p: [0, 1.47, 0], q: IDENT_Q },
      { h: [1.6, 1.0, 0.55],  p: [-0.7, 1.55, -0.9], q: IDENT_Q },
      { h: [2.4, 0.9, 0.6],   p: [0, -0.9, 0], q: IDENT_Q },
    ],
  },
  {
    name: "crt", object: crtFlight,
    delay: 0.4,
    position: { x: -1.8, y: 16.5, z: 0.3 },
    rotation: { x: D2R(-2), y: D2R(3), z: D2R(-3) },
    velocity: { x: 0, y: -0.5, z: 0 },
    angularVelocity: { x: -0.12, y: 0.15, z: 0.10 },
    mass: 14, dropDamp: 3.2, dropG: 1.0, fallDamp: 24,
    colliders: [
      { h: [2.016, 1.584, 1.224], p: [0, 0, 0], q: IDENT_Q },
      { h: [1.332, 0.252, 0.936], p: [0, -2.16, 0.036], q: IDENT_Q },
    ],
  },
  {
    name: "laptop", object: lapFlight,
    delay: 0.9,
    position: { x: 2.2, y: 17.5, z: -0.3 },
    rotation: { x: D2R(14), y: D2R(28), z: D2R(10) },
    velocity: { x: 0, y: -0.5, z: 0 },
    angularVelocity: { x: 0.15, y: -0.15, z: 0.12 },
    mass: 4, dropDamp: 2.4, dropG: 0.85, fallDamp: 37,
    colliders: [
      /* base (inner offset rotated by base yaw) */
      { h: [1.6, 0.075, 1.05], p: [0, 0.1, 0], q: Q(0, D2R(-18), 0) },
      /* open lid: pivot + tilted center, then base yaw */
      { h: [1.5875, 0.9375, 0.05], p: [0.3725, 1.06, -1.1465],
        q: Q(D2R(-12), D2R(-18), 0, "YXZ") },
    ],
  },
]);

/* ============================================================
   CAMERA RIG + FOCUS + GRAB.
   Click a screen: the camera flies in and that machine is yours
   (body frozen so the screen is stable). ESC / button steps back
   out. Drag a body: its fall suspends while held.
   ============================================================ */
const easeIO = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const _tgt = OVERVIEW_TGT.clone();
let camTween = null;
function tweenCamTo(p1, t1, dur, done){
  camTween = {t:0, dur, p0:camera.position.clone(), p1:p1.clone(),
              t0:_tgt.clone(), t1:t1.clone(), done};
}
function computeFocusPose(mesh, w, h){
  mesh.updateWorldMatrix(true,false);
  const center = new THREE.Vector3(); mesh.getWorldPosition(center);
  const q = new THREE.Quaternion(); mesh.getWorldQuaternion(q);
  const normal = new THREE.Vector3(0,0,1).applyQuaternion(q).normalize();
  const up = new THREE.Vector3(0,1,0);
  const side = new THREE.Vector3().crossVectors(normal,up);
  if(side.lengthSq() < 1e-6) side.set(1,0,0); else side.normalize();
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2*Math.atan(Math.tan(vFov/2)*camera.aspect);
  const fitH = (h/2)/Math.tan(vFov/2)/0.90;
  const fitW = (w/2)/Math.tan(hFov/2)/0.92;
  const dist = THREE.MathUtils.clamp(Math.max(fitH,fitW), 2, 14);
  const pos = center.clone()
    .addScaledVector(normal, dist)
    .addScaledVector(up, dist*0.04)
    .addScaledVector(side, dist*0.025);
  return {pos, tgt:center.clone()};
}

const exitBtn = document.getElementById("exitBtn");
const hud = document.getElementById("hud");
let focused = null;          // 'crt' | 'laptop' | 'tv' | null
let downInfo = null;         // pending click (screen focus vs grab decision)

function setPtr(e){
  _ptr.x = (e.clientX/innerWidth)*2-1;
  _ptr.y = -(e.clientY/innerHeight)*2+1;
}
function rayScreens(e){
  setPtr(e); _ray.setFromCamera(_ptr, camera);
  if(_ray.intersectObject(crt.display, false).length) return "crt";
  if(_ray.intersectObject(lap.display, false).length) return "laptop";
  if(_ray.intersectObjects([tvd.glass, tvd.innerScreen], false).length) return "tv";
  return null;
}

function enterFocus(name){
  if(focused) return;
  focused = name;
  exitBtn.classList.add("show");
  hud.classList.add("gone");
  renderer.domElement.style.cursor = "none";
  let mesh, w, h;
  if(name==="crt"){ mesh=crt.display; w=crt.screenW*CRT_S; h=crt.screenH*CRT_S;
    crt.S.cursorActive = true;
    if(!crt.S.power){ crt.togglePower(); } }
  if(name==="laptop"){ mesh=lap.display; w=lap.screenW*LAP_S; h=lap.screenH*LAP_S;
    lap.cursorActive = true; }
  if(name==="tv"){ mesh=tvd.innerScreen; w=tvd.screenW*TV_S; h=tvd.screenH*TV_S;
    if(!tvd.powered){ tvd.togglePower(); } }
  const pose = computeFocusPose(mesh, w, h);
  tweenCamTo(pose.pos, pose.tgt, 1.4, ()=>{});
  /* freeze the whole scene mid-air, not just this machine */
  falling.setFrozen("crt", true);
  falling.setFrozen("laptop", true);
  falling.setFrozen("tv", true);
}
function exitFocus(){
  if(!focused) return;
  falling.setFrozen("crt", false);
  falling.setFrozen("laptop", false);
  falling.setFrozen("tv", false);
  if(focused==="crt"){ crt.S.cursorActive = false; }
  if(focused==="laptop"){ lap.cursorActive = false; lap.winDragging = false; }
  focused = null;
  exitBtn.classList.remove("show");
  hud.classList.remove("gone");
  renderer.domElement.style.cursor = "default";
  tweenCamTo(OVERVIEW_POS, OVERVIEW_TGT, 1.25, ()=>{});
}
exitBtn.addEventListener("click", exitFocus);
addEventListener("keydown", (e)=>{
  if(e.key === "Escape"){
    if(focused){ exitFocus(); return; }
    if(lap.winDragging) lap.winDragging = false;
    return;
  }
  if(focused === "laptop" && !e.metaKey && !e.ctrlKey && !e.altKey){
    lap.flashKey(e.code);
    const m = lap.keyByCode[e.code]; if(m) m.userData.held = true;
    if(e.code === "Backspace") lap.typeKey("back");
    else if(e.key && e.key.length === 1) lap.typeKey(e.key);
    if(e.key === " " || e.key === "Tab") e.preventDefault();
  }
});
addEventListener("keyup", (e)=>{
  const m = lap.keyByCode[e.code]; if(m) m.userData.held = false;
});

renderer.domElement.addEventListener("pointerdown", (e)=>{
  if(focused){
    /* laptop window title drag while inside */
    if(focused === "laptop"){
      const c = lap.cursor;
      if(lap.windowOpen && lap.inTitle(c.x, c.y) && !lap.inClose(c.x, c.y)){
        lap.winDragging = true;
        lap.setWinGrab(lap.WIN.x - c.x, lap.WIN.y - c.y);
      }
    }
    return;
  }
  /* click a screen to step inside (laptop / tv), or anywhere on
     the CRT body — its whole screen is the game now */
  const scr = rayScreens(e);
  if(scr && scr !== "crt"){ downInfo = {x:e.clientX, y:e.clientY, kind:"focus", screen:scr}; return; }
  setPtr(e); _ray.setFromCamera(_ptr, camera);
  if(_ray.intersectObject(crt.group, true).length){
    downInfo = {x:e.clientX, y:e.clientY, kind:"focus", screen:"crt"}; return;
  }
});
renderer.domElement.addEventListener("pointermove", (e)=>{
  if(focused === "crt"){
    /* drive the CRT arrow from the real pointer via screen UV */
    setPtr(e); _ray.setFromCamera(_ptr, camera);
    const hit = _ray.intersectObject(crt.display, false)[0];
    if(hit && hit.uv){
      crt.S.cursor.x = THREE.MathUtils.clamp(hit.uv.x*640, 0, 640);
      crt.S.cursor.y = THREE.MathUtils.clamp((1-hit.uv.y)*480, 0, 480);
    }
    return;
  }
  if(focused === "laptop"){
    /* drive the virtual cursor from the real pointer via screen UV */
    setPtr(e); _ray.setFromCamera(_ptr, camera);
    const hit = _ray.intersectObject(lap.display, false)[0];
    if(hit && hit.uv){
      const c = lap.cursor;
      c.x = THREE.MathUtils.clamp(hit.uv.x*lap.OS_W, 0, lap.OS_W);
      c.y = THREE.MathUtils.clamp((1-hit.uv.y)*lap.OS_H, 0, lap.OS_H);
      if(lap.winDragging){ lap.setWIN(c.x+lap.winGrab.dx, c.y+lap.winGrab.dy); }
    }
    return;
  }
  if(focused) return;
});
renderer.domElement.addEventListener("pointerup", (e)=>{
  if(focused){
    /* clicks while inside go to the device OS.
       The CRT runs the overlay page itself — only its physical
       power button is handled here. */
    if(focused === "crt"){
      setPtr(e); _ray.setFromCamera(_ptr, camera);
      if(_ray.intersectObject(crt.powerButton, false).length){ crt.togglePower(); return; }
      const dh = _ray.intersectObject(crt.display, false)[0];
      if(dh && dh.uv) crt.clickOS(Math.floor(dh.uv.x*640), Math.floor((1-dh.uv.y)*480));
    }else if(focused === "laptop"){
      const c = lap.cursor;
      if(lap.windowOpen){
        if(lap.inClose(c.x,c.y)){ lap.handleVirtualClick(c.x,c.y); return; }
        if(lap.inTitle(c.x,c.y)){ return; }
        return;
      }
      lap.handleVirtualClick(c.x, c.y);
    }else if(focused === "tv"){
      setPtr(e); _ray.setFromCamera(_ptr, camera);
      if(_ray.intersectObject(tvd.powerDial, true).length){ tvd.togglePower(); }
    }
    lap.winDragging = false;
    return;
  }
  if(!downInfo) return;
  /* click (not drag) on a screen steps inside */
  if(Math.hypot(e.clientX-downInfo.x, e.clientY-downInfo.y) > 6){ downInfo = null; return; }
  if(downInfo.kind === "focus") enterFocus(downInfo.screen);
  downInfo = null;
});
renderer.domElement.addEventListener("pointercancel", (e)=>{
  downInfo = null;
  lap.winDragging = false;
});
renderer.domElement.addEventListener("wheel", (e)=>{
  if(focused === "crt" && crt.S.pdfOpen){
    crt.S.pdfScroll = THREE.MathUtils.clamp(crt.S.pdfScroll + e.deltaY*.3, 0, 80);
    e.preventDefault();
  }else if(focused === "laptop" && lap.windowOpen){
    lap.scrollPdf(e.deltaY*.6);
    e.preventDefault();
  }
}, {passive:false});

/* ============================================================
   MAIN LOOP — controller steps physics, Three.js renders
   ============================================================ */
const clock = new THREE.Clock();
let hidden = false;
let staticAcc = 0;
let uiTick = 0;
document.addEventListener("visibilitychange", ()=>{ hidden = document.hidden; });

function animate(){
  requestAnimationFrame(animate);
  if(hidden) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  falling.update(dt);

  /* camera flights (screen focus transitions) */
  if(camTween){
    camTween.t += dt/camTween.dur;
    const k = easeIO(Math.min(1, camTween.t));
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);
    _tgt.lerpVectors(camTween.t0, camTween.t1, k);
    if(camTween.t >= 1){
      const done = camTween.done; camTween = null; done && done();
    }
  }
  camera.lookAt(_tgt);

  /* screens stay alive.
     Canvas redraws run at half rate — the texture uploads are the
     most expensive per-frame work here, and 30Hz is invisible. */
  uiTick++;
  if(crt.S.power && !crt.S.ready){ crt.S.bootT += dt; if(crt.S.bootT > 1) crt.S.ready = true; }
  if(uiTick % 2 === 0){
    if(!crt.S.gameOpen) crt.drawScreen(t);
    lap.drawOS();
  }
  lap.updateKeys();
  if(tvd.powered){
    staticAcc += dt;
    if(staticAcc > 0.07){ tvd.drawStatic(); staticAcc = 0; }
    tvd.screenMat.emissiveIntensity = 1.2 + Math.sin(performance.now()*0.016)*0.035;
  }

  /* the CRT belongs to the game page while it is open; closing it
     reveals the working desktop underneath. Canvas display stays
     dark glass behind the overlay. */
  gameObj.visible = crt.S.power && crt.S.gameOpen;
  gameDiv.style.pointerEvents = (focused === "crt" && crt.S.gameOpen) ? "auto" : "none";
  crt.display.visible = crt.S.power && !crt.S.gameOpen;

  renderer.render(scene, camera);
  cssRenderer.render(scene, camera);
}
animate();

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  cssRenderer.setSize(innerWidth, innerHeight);
  if(focused){
    const m = focused==="crt" ? crt.display :
              focused==="laptop" ? lap.display : tvd.innerScreen;
    const w = focused==="crt" ? crt.screenW*CRT_S :
              focused==="laptop" ? lap.screenW*LAP_S : tvd.screenW*TV_S;
    const h = focused==="crt" ? crt.screenH*CRT_S :
              focused==="laptop" ? lap.screenH*LAP_S : tvd.screenH*TV_S;
    const pose = computeFocusPose(m, w, h);
    camera.position.copy(pose.pos); _tgt.copy(pose.tgt);
  }
});
</script>
</body>
