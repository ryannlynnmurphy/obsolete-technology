<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { CSS3DRenderer, CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";
import { FallingDevices } from "./FallingDevices.js";
import { createSoftieCRTEffect } from "./softie-crt-effect.js";
import { wireSoftieOS } from "./softie-os-bridge.js";

/* ============================================================
   SHARED VOID STAGE
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060708);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 200);
const OVERVIEW_POS = new THREE.Vector3(0, 2, 27);
const OVERVIEW_TGT = new THREE.Vector3(0, 2, 0);
camera.position.copy(OVERVIEW_POS);
camera.lookAt(OVERVIEW_TGT);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

/* DOM overlay layer: hosts the solitaire game as a live page mapped
   onto the CRT screen. Click-through everywhere except the game. */
const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(innerWidth, innerHeight);
cssRenderer.domElement.style.position = "fixed";
cssRenderer.domElement.style.top = "0";
cssRenderer.domElement.style.left = "0";
cssRenderer.domElement.style.pointerEvents = "none";
cssRenderer.domElement.style.zIndex = "5";
document.body.appendChild(cssRenderer.domElement);

/* Soft studio illumination, no visible fixtures — union of the three original rigs */
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x0a0c10, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.3);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
/* wide shadow frustum — the pile is tall */
keyLight.shadow.camera.left = -12; keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12; keyLight.shadow.camera.bottom = -12;
keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 40;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x9db8ff, 2.3);
rimLight.position.set(-5, 3.5, -6);
scene.add(rimLight);
const warm = new THREE.PointLight(0xffb477, 10, 14);
warm.position.set(5, 0.5, 4);
scene.add(warm);
const underFill = new THREE.DirectionalLight(0x3a4356, 0.6);
underFill.position.set(0, -4, 2);
scene.add(underFill);

/* Reused temps — never allocate inside the loop */
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3();
const _ray = new THREE.Raycaster(), _ptr = new THREE.Vector2();

/* ============================================================
   DEVICE 1 — CRT MONITOR (geometry / materials / OS preserved)
   ============================================================ */
function buildCRT(){
  const group = new THREE.Group();
  const plastic = new THREE.MeshStandardMaterial({color:0xb7aa89,roughness:.72});
  const plasticShadow = new THREE.MeshStandardMaterial({color:0x867c64,roughness:.8});
  const darkPlastic = new THREE.MeshStandardMaterial({color:0x35342f,roughness:.8});
  const black = new THREE.MeshStandardMaterial({color:0x080909,roughness:.6});
  const ledOn = new THREE.MeshStandardMaterial({color:0x9fc987,emissive:0x76ff5c,emissiveIntensity:4});
  const ledOff = new THREE.MeshStandardMaterial({color:0x331111,emissive:0x220000,emissiveIntensity:1});
  function add(mesh,x=0,y=0,z=0){mesh.position.set(x,y,z);
    mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);return mesh;}

  add(new THREE.Mesh(new RoundedBoxGeometry(5.6,4.4,2.7,8,.28),plastic));
  const back = add(new THREE.Mesh(new RoundedBoxGeometry(4.7,3.65,3.3,8,.42),plastic),0,.1,-1.35);
  back.scale.set(.9,.9,1);
  add(new THREE.Mesh(new RoundedBoxGeometry(3.55,2.65,.4,6,.24),plasticShadow),0,.15,-3.05);
  add(new THREE.Mesh(new RoundedBoxGeometry(5.25,4.05,.32,8,.26),plastic),0,0,1.46);
  add(new THREE.Mesh(new RoundedBoxGeometry(4.35,3.05,.3,8,.28),darkPlastic),-0.18,.25,1.65);

  const scrCanvas = document.createElement("canvas"); scrCanvas.width=640; scrCanvas.height=480;
  const g = scrCanvas.getContext("2d");
  const scrTex = new THREE.CanvasTexture(scrCanvas);
  scrTex.colorSpace = THREE.SRGBColorSpace;
  const display = new THREE.Mesh(new THREE.PlaneGeometry(3.5,2.45),
    new THREE.MeshBasicMaterial({map:scrTex,toneMapped:false}));
  display.position.set(-0.18,.25,1.82); group.add(display);

  add(new THREE.Mesh(new RoundedBoxGeometry(4.2,.47,.19,6,.07),plasticShadow),.15,-1.65,1.65);
  const powerButton = add(new THREE.Mesh(new RoundedBoxGeometry(.48,.3,.22,4,.045),darkPlastic),1.75,-1.65,1.81);
  const led = new THREE.Mesh(new THREE.SphereGeometry(.065,20,20),ledOn);
  led.position.set(1.35,-1.65,1.81); group.add(led);

  for(const s of [-1,1]) for(let i=0;i<9;i++){
    const v=new THREE.Mesh(new THREE.BoxGeometry(.035,.09,1.35),black);
    v.position.set(s*2.81,1.15-i*.22,-.35); group.add(v);
  }
  for(let i=0;i<12;i++){
    const v=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,1.1),black);
    v.position.set(-1.3+i*.24,2.215,-.6); group.add(v);
  }
  add(new THREE.Mesh(new RoundedBoxGeometry(1.45,.85,1.25,6,.18),plastic),0,-2.55,-.1);
  add(new THREE.Mesh(new RoundedBoxGeometry(3.7,.42,2.6,8,.18),plastic),0,-3.08,.05);

  /* The screen belongs to solitaire-win2000.html now — this canvas
     is just dark glass behind the overlay. */
  const S = {power:true};
  function drawScreen(t){
    const W=640,H=480;
    g.fillStyle="#0b0b0c";g.fillRect(0,0,W,H);
    scrTex.needsUpdate=true;
  }
  function clickOS(px,py){ /* handled by the overlay page itself */ }
  function togglePower(){
    S.power=!S.power;
    led.material=S.power?ledOn:ledOff;
    powerButton.position.z-= .06; setTimeout(()=>powerButton.position.z+=.06,120);
  }
  return {group, display, powerButton, S, drawScreen, clickOS, togglePower,
    screenW:3.5, screenH:2.45};
}

/* ============================================================
   DEVICE 2 — LAPTOP (geometry / keyboard / Ryann OS preserved)
   ============================================================ */
function buildLaptop(){
  const laptop = new THREE.Group();
  const LAPTOP_BASE_ROT = THREE.MathUtils.degToRad(-18);
  laptop.rotation.y = LAPTOP_BASE_ROT;

  const aluminum = new THREE.MeshStandardMaterial({color:0xb8babd,metalness:.8,roughness:.28});
  const darkAlu = new THREE.MeshStandardMaterial({color:0x303236,metalness:.7,roughness:.32});
  const blackMat = new THREE.MeshStandardMaterial({color:0x090909,roughness:.32,metalness:.15});
  const keyMatBase = new THREE.MeshStandardMaterial({color:0x191919,roughness:.55});

  const OS_W=1024, OS_H=560;
  const osCanvas=document.createElement("canvas");
  osCanvas.width=OS_W; osCanvas.height=OS_H;
  const ctx=osCanvas.getContext("2d");
  const osTex=new THREE.CanvasTexture(osCanvas);
  osTex.colorSpace=THREE.SRGBColorSpace;
  osTex.anisotropy=8;

  const ICON={x:70,y:70,w:100,h:122};
  let WIN={x:142,y:48,w:740,h:464};
  const TITLE_H=40;
  let selected=false, windowOpen=false;
  let cursor={x:512,y:300}, cursorActive=false;
  let pdfScroll=0, typedBuffer="", typedUntil=0;
  let lastVirtualClick=0;

  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function drawOS(){
    const now=performance.now();
    /* unbranded dark workstation: deep indigo field, near-black top bar */
    const g=ctx.createLinearGradient(0,0,OS_W,OS_H);
    g.addColorStop(0,"#232b45");g.addColorStop(.55,"#161b2e");g.addColorStop(1,"#0b0e18");
    ctx.fillStyle=g;ctx.fillRect(0,0,OS_W,OS_H);
    /* faint terminal-grid texture */
    ctx.fillStyle="rgba(120,160,255,.045)";
    for(let gx=0;gx<OS_W;gx+=32)ctx.fillRect(gx,32,1,OS_H-32);
    for(let gy=32;gy<OS_H;gy+=32)ctx.fillRect(0,gy,OS_W,1);
    ctx.fillStyle="#0a0c11";ctx.fillRect(0,0,OS_W,32);
    ctx.fillStyle="#e8eaf0";ctx.font="600 14px system-ui";ctx.textBaseline="middle";
    ctx.fillText("ryann",14,17);
    ctx.fillStyle="#8b93a7";ctx.font="14px system-ui";
    ctx.fillText("desktop",72,17);
    ctx.textAlign="right";
    ctx.fillStyle="#c9cfdd";
    ctx.fillText(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+"   100%",OS_W-14,17);
    ctx.textAlign="left";
    const ix=ICON.x,iy=ICON.y;
    if(selected){ctx.fillStyle="rgba(90,140,255,.35)";rr(ix-10,iy-8,ICON.w+20,ICON.h+22,12);ctx.fill();}
    ctx.fillStyle="#dfe3ec";ctx.strokeStyle="rgba(0,0,0,.5)";
    ctx.beginPath();ctx.moveTo(ix+10,iy);ctx.lineTo(ix+70,iy);ctx.lineTo(ix+86,iy+16);
    ctx.lineTo(ix+86,iy+84);ctx.lineTo(ix+10,iy+84);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#b02a37";ctx.fillRect(ix+10,iy+52,76,22);
    ctx.fillStyle="#fff";ctx.font="bold 13px system-ui";ctx.fillText("PDF",ix+32,iy+64);
    ctx.fillStyle="#e8eaf0";ctx.font="13px system-ui";ctx.textAlign="center";
    ctx.fillText("rx.pdf",ix+48,iy+102);ctx.textAlign="left";
    if(typedBuffer && now<typedUntil){
      ctx.fillStyle="rgba(5,8,12,.92)";rr(OS_W/2-180,OS_H-52,360,34,17);ctx.fill();
      ctx.strokeStyle="rgba(74,222,128,.4)";rr(OS_W/2-180,OS_H-52,360,34,17);ctx.stroke();
      ctx.fillStyle="#4ade80";ctx.font="15px ui-monospace,monospace";ctx.textAlign="center";
      ctx.fillText("$ "+typedBuffer.slice(-28)+"_",OS_W/2,OS_H-34);ctx.textAlign="left";
    }
    if(windowOpen){
      ctx.save();ctx.shadowColor="rgba(0,0,0,.6)";ctx.shadowBlur=30;ctx.shadowOffsetY=10;
      ctx.fillStyle="#161a23";rr(WIN.x,WIN.y,WIN.w,WIN.h,12);ctx.fill();ctx.restore();
      ctx.save();rr(WIN.x,WIN.y,WIN.w,WIN.h,12);ctx.clip();
      ctx.fillStyle="#232936";ctx.fillRect(WIN.x,WIN.y,WIN.w,TITLE_H);
      ctx.strokeStyle="#3a4152";ctx.beginPath();
      ctx.moveTo(WIN.x,WIN.y+TITLE_H+.5);ctx.lineTo(WIN.x+WIN.w,WIN.y+TITLE_H+.5);ctx.stroke();
      ctx.fillStyle="#e0605e";ctx.beginPath();ctx.arc(WIN.x+26,WIN.y+20,10,0,7);ctx.fill();
      ctx.fillStyle="#1a0d0d";ctx.font="bold 12px system-ui";ctx.textAlign="center";
      ctx.fillText("x",WIN.x+26,WIN.y+21);ctx.textAlign="left";
      ctx.fillStyle="#3a4152";ctx.beginPath();ctx.arc(WIN.x+48,WIN.y+20,8,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(WIN.x+66,WIN.y+20,8,0,7);ctx.fill();
      ctx.fillStyle="#aab2c5";ctx.font="13px ui-monospace,monospace";ctx.textAlign="center";
      ctx.fillText("rx@dev: ~/rx.pdf",WIN.x+WIN.w/2,WIN.y+21);ctx.textAlign="left";
      const cy=WIN.y+TITLE_H;
      ctx.fillStyle="#0d1017";ctx.fillRect(WIN.x,cy,WIN.w,WIN.h-TITLE_H);
      ctx.save();ctx.beginPath();ctx.rect(WIN.x,cy,WIN.w,WIN.h-TITLE_H);ctx.clip();
      ctx.translate(0,-pdfScroll);
      const px=WIN.x+70, pw=WIN.w-140;
      ctx.font="14px ui-monospace,monospace";
      for(let p=0;p<2;p++){
        const py=cy+24+p*330;
        if(p===0){
          ctx.fillStyle="#7dd3fc";
          ctx.fillText("rx@dev:~$ cat rx.pdf",px,py+30);
          ctx.fillStyle="#d4d4d4";
          ctx.fillText("This file is intentionally quiet.",px,py+72);
          ctx.fillText("There is nothing else on this computer.",px,py+98);
          ctx.fillStyle="#2c3342";
          for(let i=0;i<4;i++)ctx.fillRect(px,py+127+i*22,pw-(i*40),10);
          ctx.fillStyle="#5b6478";
          ctx.fillText("rx@dev:~$ _",px,py+252);
        }else{
          ctx.fillStyle="#2c3342";
          for(let i=0;i<6;i++)ctx.fillRect(px,py+50+i*22,pw-(i*30),10);
          ctx.fillStyle="#5b6478";
          ctx.fillText("— end of file —",px,py+230);
        }
      }
      ctx.restore();ctx.restore();
    }
    if(cursorActive){
      ctx.fillStyle="#fff";ctx.strokeStyle="#000";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cursor.x,cursor.y);ctx.lineTo(cursor.x,cursor.y+20);
      ctx.lineTo(cursor.x+6,cursor.y+15);ctx.lineTo(cursor.x+9,cursor.y+21);
      ctx.lineTo(cursor.x+12,cursor.y+19);ctx.lineTo(cursor.x+9,cursor.y+13);
      ctx.lineTo(cursor.x+15,cursor.y+13);ctx.closePath();ctx.fill();ctx.stroke();
    }
    osTex.needsUpdate=true;
  }

  const inIcon=(x,y)=>x>ICON.x-12&&x<ICON.x+ICON.w+12&&y>ICON.y-10&&y<ICON.y+ICON.h+14;
  const inClose=(x,y)=>Math.hypot(x-(WIN.x+26),y-(WIN.y+20))<14;
  const inTitle=(x,y)=>x>WIN.x&&x<WIN.x+WIN.w&&y>WIN.y&&y<WIN.y+TITLE_H;
  let winDragging=false, winGrabDX=0, winGrabDY=0;
  function handleVirtualClick(cx,cy){
    if(windowOpen){
      if(inClose(cx,cy)){windowOpen=false;winDragging=false;}
      return;
    }
    if(inIcon(cx,cy)){
      const now=performance.now();
      if(now-lastVirtualClick<380){windowOpen=true;selected=true;pdfScroll=0;}
      else selected=true;
      lastVirtualClick=now;
    }else selected=false;
  }
  function typeKey(ch){
    if(ch==='back'){typedBuffer=typedBuffer.slice(0,-1);typedUntil=performance.now()+2000;return;}
    if(typeof ch==='string'&&ch.length===1){typedBuffer=(typedBuffer+ch).slice(-40);typedUntil=performance.now()+2000;}
  }

  /* ---- laptop hardware ---- */
  const base=new THREE.Mesh(new THREE.BoxGeometry(6.4,.22,4.2),aluminum);
  base.position.y=.2;laptop.add(base);
  const lower=new THREE.Mesh(new THREE.BoxGeometry(6.28,.07,4.08),darkAlu);
  lower.position.y=.075;laptop.add(lower);
  const bed=new THREE.Mesh(new THREE.BoxGeometry(5.45,.025,2.15),blackMat);
  bed.position.set(0,.325,-.60);laptop.add(bed);

  const K=(label,width,code,opts={})=>({label,width,code,sub:opts.sub,type:opts.type||(label.length===1?'char':'modifier')});
  const keyboardLayout=[
   [K('esc',1,'Escape'),K('F1',1,'F1'),K('F2',1,'F2'),K('F3',1,'F3'),K('F4',1,'F4'),K('F5',1,'F5'),K('F6',1,'F6'),K('F7',1,'F7'),K('F8',1,'F8'),K('F9',1,'F9'),K('F10',1,'F10'),K('F11',1,'F11'),K('F12',1,'F12'),K('del',2,'Delete')],
   [K('`',1,'Backquote',{sub:'~'}),K('1',1,'Digit1',{sub:'!'}),K('2',1,'Digit2',{sub:'@'}),K('3',1,'Digit3',{sub:'#'}),K('4',1,'Digit4',{sub:'$'}),K('5',1,'Digit5',{sub:'%'}),K('6',1,'Digit6',{sub:'^'}),K('7',1,'Digit7',{sub:'&'}),K('8',1,'Digit8',{sub:'*'}),K('9',1,'Digit9',{sub:'('}),K('0',1,'Digit0',{sub:')'}),K('-',1,'Minus',{sub:'_'}),K('=',1,'Equal',{sub:'+'}),K('backspace',2,'Backspace')],
   [K('tab',1.5,'Tab'),K('Q',1,'KeyQ'),K('W',1,'KeyW'),K('E',1,'KeyE'),K('R',1,'KeyR'),K('T',1,'KeyT'),K('Y',1,'KeyY'),K('U',1,'KeyU'),K('I',1,'KeyI'),K('O',1,'KeyO'),K('P',1,'KeyP'),K('[',1,'BracketLeft',{sub:'{'}),K(']',1,'BracketRight',{sub:'}'}),K('\\',1.5,'Backslash',{sub:'|'})],
   [K('caps',1.75,'CapsLock'),K('A',1,'KeyA'),K('S',1,'KeyS'),K('D',1,'KeyD'),K('F',1,'KeyF'),K('G',1,'KeyG'),K('H',1,'KeyH'),K('J',1,'KeyJ'),K('K',1,'KeyK'),K('L',1,'KeyL'),K(';',1,'Semicolon',{sub:':'}),K("'",1,'Quote',{sub:'"'}),K('enter',2.25,'Enter')],
   [K('shift',2.25,'ShiftLeft'),K('Z',1,'KeyZ'),K('X',1,'KeyX'),K('C',1,'KeyC'),K('V',1,'KeyV'),K('B',1,'KeyB'),K('N',1,'KeyN'),K('M',1,'KeyM'),K(',',1,'Comma',{sub:'<'}),K('.',1,'Period',{sub:'>'}),K('/',1,'Slash',{sub:'?'}),K('shift',2.75,'ShiftRight')],
   [K('ctrl',1.25,'ControlLeft'),K('fn',1,'Fn'),K('alt',1.25,'AltLeft'),K('cmd',1.25,'MetaLeft'),K('space',6,'Space',{type:'space'}),K('alt',1.25,'AltRight'),K('←',1,'ArrowLeft',{type:'arrow'}),{width:1,stack:[K('↑',1,'ArrowUp',{type:'arrow'}),K('↓',1,'ArrowDown',{type:'arrow'})]},K('→',1,'ArrowRight',{type:'arrow'})]
  ];
  const KB_W=5.0, KB_UNITS=15, KB_PITCH=KB_W/KB_UNITS;
  const KB_GX=.045, KB_GZ=.05, KB_D=.27, KB_H=.05, KB_CZ=-.60, KB_Y=.35, KB_TRAVEL=.018;
  const KB_ROWS=keyboardLayout.length, KB_DEPTH=KB_ROWS*KB_D+(KB_ROWS-1)*KB_GZ;
  const keyMeshes=[], keyByCode={};
  const keyGeoCache=new Map(), legendTexCache=new Map();
  const legendPlaneGeo=new THREE.PlaneGeometry(1,1);
  function kbGeometry(w,d){
    const k=w.toFixed(3)+'|'+d.toFixed(3);
    let gr=keyGeoCache.get(k);
    if(!gr){gr=new RoundedBoxGeometry(w,KB_H,d,2,.015);keyGeoCache.set(k,gr);}
    return gr;
  }
  function kbLegendMaterial(def,half){
    if(def.type==='space')return null;
    const bucket=half?'half':def.width>=2?'wide':'narrow';
    const cacheKey=def.label+'|'+(def.sub||'')+'|'+bucket;
    let tex=legendTexCache.get(cacheKey);
    if(!tex){
      const cw=bucket==='wide'?256:128, ch=half?48:96;
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const c2=cv.getContext('2d');
      c2.clearRect(0,0,cw,ch);
      c2.textAlign='center';c2.textBaseline='middle';
      if(def.sub){
        c2.fillStyle='#9aa0a6';c2.font='400 20px system-ui,sans-serif';
        c2.fillText(def.sub,cw/2,ch*0.26);
        c2.fillStyle='#e8eaed';c2.font='600 38px system-ui,sans-serif';
        c2.fillText(def.label,cw/2,ch*0.64);
      }else if(def.label.length===1){
        c2.fillStyle='#e8eaed';c2.font='600 40px system-ui,sans-serif';
        c2.fillText(def.label,cw/2,ch/2+1);
      }else{
        c2.fillStyle='#cfd3d8';c2.font='600 24px system-ui,sans-serif';
        c2.fillText(def.label,cw/2,ch/2+1);
      }
      tex=new THREE.CanvasTexture(cv);
      tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
      legendTexCache.set(cacheKey,tex);
    }
    return new THREE.MeshBasicMaterial({map:tex,transparent:true,toneMapped:false,depthWrite:false});
  }
  function kbMakeKey(def,w,d,cx,cz,half){
    const m=new THREE.Mesh(kbGeometry(w,d),keyMatBase);
    m.position.set(cx,KB_Y,cz);
    m.userData={type:'keyboardKey',label:def.label,code:def.code,def,baseY:KB_Y,pressedUntil:0,held:false};
    const lm=kbLegendMaterial(def,half);
    if(lm){
      const leg=new THREE.Mesh(legendPlaneGeo,lm);
      leg.rotation.x=-Math.PI/2;
      leg.scale.set(w*(half?0.66:0.78),d*(half?0.6:0.62),1);
      leg.position.y=KB_H/2+.0012;
      leg.renderOrder=2;
      leg.raycast=()=>{};
      m.add(leg);
    }
    laptop.add(m);keyMeshes.push(m);keyByCode[def.code]=m;
    return m;
  }
  keyboardLayout.forEach((row,r)=>{
    let x=-KB_W/2;
    const z=KB_CZ-KB_DEPTH/2+KB_D/2+r*(KB_D+KB_GZ);
    row.forEach(def=>{
      if(def.stack){
        const hw=def.width*KB_PITCH-KB_GX, hd=(KB_D-KB_GZ)/2;
        def.stack.forEach((s,i)=>{
          kbMakeKey(s,hw,hd,x+def.width*KB_PITCH/2,z-KB_D/2+hd/2+i*(hd+KB_GZ),true);
        });
      }else{
        kbMakeKey(def,def.width*KB_PITCH-KB_GX,KB_D,x+def.width*KB_PITCH/2,z,false);
      }
      x+=def.width*KB_PITCH;
    });
  });
  function flashKey(code,ms=140){
    const m=keyByCode[code];if(!m)return;
    m.userData.pressedUntil=performance.now()+ms;
  }

  const trackpad=new THREE.Mesh(new THREE.BoxGeometry(2.5,.018,1.0),
    new THREE.MeshStandardMaterial({color:0xa7a9ac,metalness:.75,roughness:.38}));
  trackpad.position.set(0,.325,1.28);laptop.add(trackpad);

  const OPEN_A=THREE.MathUtils.degToRad(-12);
  const pivot=new THREE.Group();pivot.position.set(0,.28,-2.02);laptop.add(pivot);
  pivot.rotation.x=OPEN_A;
  const lidBody=new THREE.Mesh(new THREE.BoxGeometry(6.35,3.75,.16),aluminum);
  lidBody.position.set(0,1.88,0);pivot.add(lidBody);
  const bezel=new THREE.Mesh(new THREE.BoxGeometry(6.13,3.52,.04),blackMat);
  bezel.position.set(0,1.88,.101);pivot.add(bezel);

    new THREE.MeshBasicMaterial({map:osTex,toneMapped:false}));
  display.position.set(0,1.88,.124);pivot.add(display);
  const lens=new THREE.Mesh(new THREE.SphereGeometry(.035,16,16),
    new THREE.MeshStandardMaterial({color:0x101820,roughness:.1}));
  lens.position.set(0,3.57,.13);pivot.add(lens);
  const lip=new THREE.Mesh(new THREE.BoxGeometry(1.1,.035,.07),darkAlu);
  lip.position.set(0,.13,2.105);laptop.add(lip);

  function updateKeys(){
    const now=performance.now();
    for(let i=0;i<keyMeshes.length;i++){
      const m=keyMeshes[i];
      const down=m.userData.held||now<m.userData.pressedUntil;
      const target=down?m.userData.baseY-KB_TRAVEL:m.userData.baseY;
      m.position.y+=(target-m.position.y)*.4;
    }
  }
  return {group:laptop, display, OS_W, OS_H, drawOS, updateKeys, flashKey,
    handleVirtualClick, typeKey, keyByCode, inClose, inTitle,
    screenW:5.75, screenH:3.15,
    get cursor(){return cursor;}, set cursor(c){cursor=c;},
    get cursorActive(){return cursorActive;}, set cursorActive(v){cursorActive=v;},
    get windowOpen(){return windowOpen;},
    get winDragging(){return winDragging;}, set winDragging(v){winDragging=v;},
    get WIN(){return WIN;}, setWIN(x,y){WIN.x=x;WIN.y=y;},
    get winGrab(){return {dx:winGrabDX,dy:winGrabDY};},
    setWinGrab(dx,dy){winGrabDX=dx;winGrabDY=dy;},
    scrollPdf(d){pdfScroll=THREE.MathUtils.clamp(pdfScroll+d,0,220);}};
}

function buildTV(){

  function makeWoodTexture() {

    for (let i=0;i<150;i++){
      const y = Math.random()*c.height, amp = 2+Math.random()*7, alpha = 0.03+Math.random()*0.09;
      ctx.strokeStyle = `rgba(255,190,110,${alpha})`; ctx.lineWidth = 1+Math.random()*2;
      ctx.beginPath(); ctx.moveTo(0,y);
      for(let x=0;x<=c.width;x+=16) ctx.lineTo(x, y+Math.sin(x*0.018+i)*amp);
      ctx.stroke();
    }
    for(let i=0;i<90;i++){
      const y=Math.random()*c.height;
      ctx.strokeStyle=`rgba(18,5,0,${0.025+Math.random()*0.05})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(c.width,y+Math.random()*8-4); ctx.stroke();
    }
    for(let i=0;i<7;i++){
      const x=Math.random()*512, y=Math.random()*512, r=6+Math.random()*18;
      const gr=ctx.createRadialGradient(x,y,1,x,y,r);
      gr.addColorStop(0,'rgba(20,8,2,0.35)'); gr.addColorStop(1,'rgba(20,8,2,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    const tex=new THREE.CanvasTexture(c);
    tex.colorSpace=THREE.SRGBColorSpace;
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
    tex.repeat.set(1.8,1.2);

  topLip.rotation.z = 0.004;
  add(new THREE.Mesh(new RoundedBoxGeometry(CAB_W+0.14,0.14, CAB_D+0.1,4,.04),trimWood),0,0.58,0);

  add(new THREE.Mesh(new RoundedBoxGeometry(5.5,2.3,0.14,5,.05),darkWood),0,2.08,0.78);
  add(new THREE.Mesh(new RoundedBoxGeometry(3.5,2.15,0.24,10,.3),

  function curvedPanel(w,h,bulge,segW=28,segH=18){

    for(let i=0;i<pos.count;i++){

  const innerScreen = new THREE.Mesh(curvedPanel(2.85,1.78,0.22), screenInnerMaterial);

  tv.add(innerScreen);
  const glass = new THREE.Mesh(curvedPanel(2.85,1.78,0.24), screenGlassMat);

  add(new THREE.Mesh(new RoundedBoxGeometry(1.35,2.15,0.14,4,.04),
    new THREE.MeshStandardMaterial({color:0x673118,roughness:.5})),1.85,2.2,0.9);
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.05,2.0),
    new THREE.MeshStandardMaterial({map:dialPlateTex,roughness:.55,metalness:.15}));
  plate.position.set(1.85,2.2,0.98);
  tv.add(plate);
  for(const y of [1.94,1.64]){
    add(new THREE.Mesh(new THREE.BoxGeometry(1.15,0.025,0.02),bronze),1.85,y,0.985);
  }
  function dial(x,y,radius,depth,detail=true){
    const grp=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,depth,40),bronze);
    body.rotation.x=Math.PI/2; body.castShadow=true; grp.add(body);
    if(detail){
      const cap=new THREE.Mesh(new THREE.CylinderGeometry(radius*0.7,radius*0.7,depth*1.05,32),
        new THREE.MeshStandardMaterial({color:0x2e251b,roughness:.5,metalness:.25}));
      cap.rotation.x=Math.PI/2; cap.position.z=0.02; grp.add(cap);
      const marker=new THREE.Mesh(new THREE.BoxGeometry(radius*0.09,radius*0.52,0.03),

      for(let i=0;i<18;i++){

  const powerDial = dial(1.85,2.78,0.20,0.13,true);
  dial(1.85,2.32,0.15,0.10,true);
  dial(1.85,1.76,0.09,0.08,false);

  add(new THREE.Mesh(new RoundedBoxGeometry(5.2,0.55,0.12,4,.03),trimWood),0,0.98,0.80);

        img.data[i]=n*0.86;img.data[i+1]=n*0.95;img.data[i+2]=n*0.84;img.data[i+3]=255;

      for(let y=0;y<h;y+=4) for(let x=0;x<w;x++){

      }
    }
    sctx.putImageData(img,0,0);

  }
  drawStatic();

  return {group:tv, innerScreen, glass, powerDial, drawStatic, togglePower,
    screenW:2.85, screenH:1.78, screenMat:screenInnerMaterial,

      { h: [1.332, 0.252, 0.936], p: [0, -2.16, 0.036], q: IDENT_Q },
    ],
  },
  {
    name: "laptop", object: lapFlight,
    delay: 0,
    position: { x: 3.4, y: 5.6, z: -1.6 },
    rotation: { x: D2R(18), y: D2R(22), z: D2R(6) },
    velocity: { x: 0, y: 0, z: 0 },
    angularVelocity: { x: 0, y: 0, z: 0 },
    mass: 4, dropDamp: 2.4, dropG: 0.85, fallDamp: 37,
    colliders: [
      /* base (inner offset rotated by base yaw) */
      { h: [1.6, 0.075, 1.05], p: [0, 0.1, 0], q: Q(0, D2R(-18), 0) },
      /* open lid: pivot + tilted center, then base yaw */
      { h: [1.5875, 0.9375, 0.05], p: [0.3725, 1.06, -1.1465],
        q: Q(D2R(-12), D2R(-18), 0, "YXZ") },
    ],
  },
]);

/* ---- fall-in intro: black void → fast drop → hard freeze ----
   The sculpture doesn't start staged; it arrives. The three flight
   groups fly ballistically from high start transforms and land EXACTLY
   on the sculpture transforms at INTRO_T (velocities solved for the
   target, so the freeze is a visual no-op). Rapier bodies spawn at
   that instant via spawnPaused — physics takes over with zero snap.
   Orbit / focus input stays off until the freeze lands. */
const INTRO_WAIT = 0.25, INTRO_T = 0.7, INTRO_G = -10.5;
const introMotions = new Map([
  [lapFlight, { startP: new THREE.Vector3(4.0, 15.2, -2.0), startR: new THREE.Euler(D2R(10), D2R(34), D2R(10)),
    endP: new THREE.Vector3(3.4, 5.6, -1.6), endR: new THREE.Euler(D2R(18), D2R(22), D2R(6)),
    vel: new THREE.Vector3(), ang: new THREE.Vector3() }],
  [crtFlight, { startP: new THREE.Vector3(-4.2, 15.8, -0.2), startR: new THREE.Euler(D2R(-6), D2R(-3), D2R(-9)),
    endP: new THREE.Vector3(-3.6, 3.2, 0.0), endR: new THREE.Euler(D2R(3), D2R(9), D2R(-4)),
    vel: new THREE.Vector3(), ang: new THREE.Vector3() }],
  [tvFlight, { startP: new THREE.Vector3(2.8, 16.8, 1.4), startR: new THREE.Euler(D2R(7), D2R(-13), D2R(6)),
    endP: new THREE.Vector3(2.4, -1.6, 1.6), endR: new THREE.Euler(D2R(2), D2R(-6), D2R(1)),
    vel: new THREE.Vector3(), ang: new THREE.Vector3() }],
]);
for (const m of introMotions.values()){
  m.vel.set((m.endP.x - m.startP.x) / INTRO_T,
    (m.endP.y - m.startP.y - 0.5 * INTRO_G * INTRO_T * INTRO_T) / INTRO_T,
    (m.endP.z - m.startP.z) / INTRO_T);
  m.ang.set((m.endR.x - m.startR.x) / INTRO_T,
    (m.endR.y - m.startR.y) / INTRO_T, (m.endR.z - m.startR.z) / INTRO_T);
}
let sculptureReady = false, introT = -INTRO_WAIT;
falling.setSpawnPaused(true);
for (const [g, m] of introMotions){
  g.position.copy(m.startP);
  g.rotation.copy(m.startR);
  g.visible = true;
  g.updateMatrixWorld(true);
}
function finishIntro(){
  if(sculptureReady) return;
  for (const [g, m] of introMotions){
    g.position.copy(m.endP);
    g.rotation.set(m.endR.x, m.endR.y, m.endR.z);
    g.updateMatrixWorld(true);
  }
  sculptureReady = true;
  falling.setSpawnPaused(false);
  /* Fresh orbit baseline: the fall-in counts for nothing. */
  syncOrbitFromCamera();
  prevAzimuth = azimuthOf();
  coherentTotal = 0; dominantDir = 0;
  visitedSectors = new Set([sectorOf(prevAzimuth)]);
}

/* ============================================================
   CAMERA RIG + SCULPTURE ORBIT + FOCUS.
   Sculpture mode: drag empty space to walk around the installation
   (camera-only orbit — bodies never move). A short click steps inside
   a screen; a drag orbits. ESC steps back out to the orbit spot.
   After one genuine 360° revolution the sculpture releases and falls
   away permanently (one-way transition, camera stays behind).
   ============================================================ */
const easeIO = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const _tgt = OVERVIEW_TGT.clone();
let camTween = null;
function tweenCamTo(p1, t1, dur, done){
  camTween = {t:0, dur, p0:camera.position.clone(), p1:p1.clone(),
              t0:_tgt.clone(), t1:t1.clone(), done};
}

/* ---- sculpture orbit (lightweight spherical rig, no OrbitControls
   so focus tweens / raycast / CSS3D keep their existing behavior) ---- */
const ORBIT_TGT = new THREE.Vector3(0.7, 2.4, 0); // visual center of the trio
let orbitRadius = camera.position.distanceTo(ORBIT_TGT);
let orbitTheta = Math.atan2(camera.position.x - ORBIT_TGT.x, camera.position.z - ORBIT_TGT.z);
let orbitPhi = Math.acos(THREE.MathUtils.clamp(
  (camera.position.y - ORBIT_TGT.y) / Math.max(orbitRadius, 1e-6), -1, 1));
const ORBIT_PHI_MIN = 1.05;  // modest vertical band — never flips over
const ORBIT_PHI_MAX = 1.85;
const ORBIT_THETA_SPEED = 0.0055;
const ORBIT_PHI_SPEED = 0.0032;
function syncOrbitFromCamera(){
  _v4.copy(camera.position).sub(ORBIT_TGT);
  orbitRadius = THREE.MathUtils.clamp(_v4.length(), 6, 45);
  if(orbitRadius < 1e-6) return;
  orbitTheta = Math.atan2(_v4.x, _v4.z);
  orbitPhi = THREE.MathUtils.clamp(
    Math.acos(THREE.MathUtils.clamp(_v4.y / orbitRadius, -1, 1)),
    ORBIT_PHI_MIN, ORBIT_PHI_MAX);
}
function applyOrbitToCamera(){
  const sp = Math.sin(orbitPhi), cp = Math.cos(orbitPhi);
  camera.position.set(
    ORBIT_TGT.x + orbitRadius * sp * Math.sin(orbitTheta),
    ORBIT_TGT.y + orbitRadius * cp,
    ORBIT_TGT.z + orbitRadius * sp * Math.cos(orbitTheta));
  _tgt.copy(ORBIT_TGT);
}

/* ---- genuine-revolution tracker (no UI, no progress bar) ----
   Azimuth via atan2(relX, relZ); deltas normalized across -PI/+PI so
   179° → -179° counts as ~2°, not 358°. Directional coherence: the
   dominant direction locks after ~15° of travel; small jitter is
   ignored, real reversals subtract. 12 sector bins require the camera
   to actually visit nearly every side. */
let orbitCompleted = false;   // fires triggerFinalDrop() exactly once
let prevAzimuth = null;
let coherentTotal = 0;
let dominantDir = 0;
let visitedSectors = new Set();
const ORBIT_GOAL = Math.PI * 2 - 0.15; // ~351° — fires as you arrive home
const DOMINANT_LOCK = 0.26;            // ~15°
const JITTER_EPS = 0.0009;
const REVERSAL_JITTER = 0.012;         // ~0.7° — free hand tremor
function azimuthOf(){
  return Math.atan2(camera.position.x - ORBIT_TGT.x, camera.position.z - ORBIT_TGT.z);
}
function sectorOf(az){
  const s = Math.floor((az + Math.PI) / (Math.PI * 2) * 12) % 12;
  return ((s % 12) + 12) % 12;
}
function noteAzimuthSample(az){
  if(orbitCompleted || focused || camTween || falling.isFinalDrop()){ prevAzimuth = az; return; }
  if(!sculptureReady || !falling.world){ prevAzimuth = az; return; }
  if(prevAzimuth === null){ prevAzimuth = az; visitedSectors.add(sectorOf(az)); return; }
  let d = az - prevAzimuth;
  while(d > Math.PI) d -= Math.PI * 2;
  while(d < -Math.PI) d += Math.PI * 2;
  prevAzimuth = az;
  if(Math.abs(d) < JITTER_EPS) return;
  if(dominantDir === 0){
    coherentTotal += d;
    visitedSectors.add(sectorOf(az));
    if(Math.abs(coherentTotal) >= DOMINANT_LOCK) dominantDir = Math.sign(coherentTotal);
    if(Math.abs(coherentTotal) >= ORBIT_GOAL && visitedSectors.size >= 10) fireOrbitComplete();
    return;
  }
  if(Math.sign(d) === dominantDir){
    coherentTotal += d;
    visitedSectors.add(sectorOf(az));
  }else{
    if(Math.abs(d) < REVERSAL_JITTER) return; // hand jitter — ignore
    coherentTotal += d; // real reversal subtracts; wiggling nets ~0
    if(Math.abs(coherentTotal) < DOMINANT_LOCK * 0.5){
      // lost the thread — let a new dominant direction emerge
      dominantDir = 0;
    }
  }
  if(Math.abs(coherentTotal) >= ORBIT_GOAL && visitedSectors.size >= 10) fireOrbitComplete();
}
function fireOrbitComplete(){
  if(orbitCompleted) return;
  /* Immediate release: the exact sculpture in view loses support.
     Camera stays where the orbit finished — it never chases.
     If physics is not up yet, wait — never consume the one shot. */
  if(!falling.triggerFinalDrop()) return;
  orbitCompleted = true;
}
function computeFocusPose(mesh, w, h){
  mesh.updateWorldMatrix(true,false);
  const center = new THREE.Vector3(); mesh.getWorldPosition(center);
  const q = new THREE.Quaternion(); mesh.getWorldQuaternion(q);
  const normal = new THREE.Vector3(0,0,1).applyQuaternion(q).normalize();
  const up = new THREE.Vector3(0,1,0);
  const side = new THREE.Vector3().crossVectors(normal,up);
  if(side.lengthSq() < 1e-6) side.set(1,0,0); else side.normalize();
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2*Math.atan(Math.tan(vFov/2)*camera.aspect);
  const fitH = (h/2)/Math.tan(vFov/2)/0.90;
  const fitW = (w/2)/Math.tan(hFov/2)/0.92;
  const dist = THREE.MathUtils.clamp(Math.max(fitH,fitW), 2, 14);
  const pos = center.clone()
    .addScaledVector(normal, dist)
    .addScaledVector(up, dist*0.04)
    .addScaledVector(side, dist*0.025);
  return {pos, tgt:center.clone()};
}

const exitBtn = document.getElementById("exitBtn");
let focused = null;          // 'crt' | 'laptop' | 'tv' | null
let downInfo = null;         // pending click (screen focus vs orbit-drag decision)
let lastHoverXY = null;      // last pointer position, for hover-cursor refresh
let savedOrbitPos = null, savedOrbitTgt = null; // return spot after focus
let orbitDrag = null;        // active empty-space drag → orbit (not a click)

function setPtr(e){
  _ptr.x = (e.clientX/innerWidth)*2-1;
  _ptr.y = -(e.clientY/innerHeight)*2+1;
}
function rayScreens(e){
  setPtr(e); _ray.setFromCamera(_ptr, camera);
  if(_ray.intersectObject(crt.display, false).length) return "crt";
  if(_ray.intersectObject(lap.display, false).length) return "laptop";
  if(_ray.intersectObjects([tvd.glass, tvd.innerScreen], false).length) return "tv";
  return null;
}

function enterFocus(name){
  if(focused) return;
  /* No stepping inside mid-air: screens become clickable once the
     sculpture freezes. After the release the void stays empty. */
  if(!sculptureReady || falling.isFinalDrop()) return;
  focused = name;
  savedOrbitPos = camera.position.clone();
  savedOrbitTgt = _tgt.clone();
  orbitDrag = null;
  exitBtn.classList.add("show");
  // The laptop draws its own cursor in-texture, so the system arrow hides
  // and the virtual cursor IS the mouse immediately. CRT/TV keep the arrow:
  // Softie's iframe provides the cursor over its screen, the TV has none.
  renderer.domElement.style.cursor = name === "laptop" ? "none" : "default";
  let mesh, w, h;
  if(name==="crt"){ mesh=crt.display; w=crt.screenW*CRT_S; h=crt.screenH*CRT_S;
    if(!crt.S.power){ crt.togglePower(); }
    computer.enterComputerMode(); }
  if(name==="laptop"){ mesh=lap.display; w=lap.screenW*LAP_S; h=lap.screenH*LAP_S;
    lap.cursorActive = true; }
  if(name==="tv"){ mesh=tvd.innerScreen; w=tvd.screenW*TV_S; h=tvd.screenH*TV_S;
    if(!tvd.powered){ tvd.togglePower(); } }
  const pose = computeFocusPose(mesh, w, h);
  tweenCamTo(pose.pos, pose.tgt, 1.4, ()=>{});
  /* freeze the whole scene mid-air, not just this machine */
  falling.setFrozen("crt", true);
  falling.setFrozen("laptop", true);
  falling.setFrozen("tv", true);
}
function exitFocus(){
  if(!focused) return;
  falling.setFrozen("crt", false);
  falling.setFrozen("laptop", false);
  falling.setFrozen("tv", false);
  if(focused==="laptop"){ lap.cursorActive = false; lap.winDragging = false; }
  focused = null;
  exitBtn.classList.remove("show");
  renderer.domElement.style.cursor = "default";
  /* Return to the exact orbit spot the viewer left — never reset to a
     stock overview, and never count focus travel toward the revolution. */
  const backP = savedOrbitPos ? savedOrbitPos.clone() : OVERVIEW_POS.clone();
  const backT = savedOrbitTgt ? savedOrbitTgt.clone() : OVERVIEW_TGT.clone();
  savedOrbitPos = null; savedOrbitTgt = null;
  tweenCamTo(backP, backT, 1.25, ()=>{ syncOrbitFromCamera(); prevAzimuth = azimuthOf(); });
  computer.exitComputerMode();
}
exitBtn.addEventListener("click", exitFocus);

/* Softie desktop on the CRT + a restrained CRT glass layer that only
   dips when Softie itself reports a latency moment (no random glitch).
   Esc inside Softie posts exit-screen → the bridge steps back out. */
const crtEffect = createSoftieCRTEffect({ THREE, screenMesh: crt.display, camera });
const computer = wireSoftieOS({ iframe: gameFrame, crtEffect, onExit: () => exitFocus() });
addEventListener("keydown", (e)=>{
  if(e.key === "Escape"){
    if(focused){ exitFocus(); return; }
    if(lap.winDragging) lap.winDragging = false;
    return;
  }
  /* DEBUG: Space (outside any machine) tests the release without
     orbiting. Gated on !focused so laptop typing still gets spaces.
     If the intro is still falling, Space finishes the freeze first. */
  if(e.code === "Space" && !focused && !e.metaKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    if(!sculptureReady) finishIntro();
    fireOrbitComplete();
    return;
  }
  if(focused === "laptop" && !e.metaKey && !e.ctrlKey && !e.altKey){
    lap.flashKey(e.code);
    const m = lap.keyByCode[e.code]; if(m) m.userData.held = true;
    if(e.code === "Backspace") lap.typeKey("back");
    else if(e.key && e.key.length === 1) lap.typeKey(e.key);
    if(e.key === " " || e.key === "Tab") e.preventDefault();
  }
});
addEventListener("keyup", (e)=>{
  const m = lap.keyByCode[e.code]; if(m) m.userData.held = false;
});

renderer.domElement.addEventListener("pointerdown", (e)=>{
  if(focused){
    /* laptop window title drag while inside */
    if(focused === "laptop"){
      const c = lap.cursor;
      if(lap.windowOpen && lap.inTitle(c.x, c.y) && !lap.inClose(c.x, c.y)){
        lap.winDragging = true;
        lap.setWinGrab(lap.WIN.x - c.x, lap.WIN.y - c.y);
      }
    }
    return;
  }
  if(camTween || !sculptureReady) return;
  /* Every press may become an orbit-drag; a press on a screen may
     instead become a click. The 6px threshold decides on move/up. */
  orbitDrag = {x0:e.clientX, y0:e.clientY, lx:e.clientX, ly:e.clientY, orbiting:false};
  if(falling.isFinalDrop()){ downInfo = null; return; }
  /* click a screen to step inside (laptop / tv), or anywhere on
     the CRT body — its whole screen is the game now */
  const scr = rayScreens(e);
  if(scr && scr !== "crt"){ downInfo = {x:e.clientX, y:e.clientY, kind:"focus", screen:scr}; return; }
  setPtr(e); _ray.setFromCamera(_ptr, camera);
  if(_ray.intersectObject(crt.group, true).length){
    downInfo = {x:e.clientX, y:e.clientY, kind:"focus", screen:"crt"}; return;
  }
  downInfo = null;
});
renderer.domElement.addEventListener("pointermove", (e)=>{
  if(focused === "laptop"){
    /* drive the virtual cursor from the real pointer via screen UV */
    setPtr(e); _ray.setFromCamera(_ptr, camera);
    const hit = _ray.intersectObject(lap.display, false)[0];
    if(hit && hit.uv){
      const c = lap.cursor;
      c.x = THREE.MathUtils.clamp(hit.uv.x*lap.OS_W, 0, lap.OS_W);
      c.y = THREE.MathUtils.clamp((1-hit.uv.y)*lap.OS_H, 0, lap.OS_H);
      if(lap.winDragging){ lap.setWIN(c.x+lap.winGrab.dx, c.y+lap.winGrab.dy); }
    }
    return;
  }
  if(focused) return;
  if(orbitDrag && !camTween && e.buttons){
    const totalMoved = Math.hypot(e.clientX-orbitDrag.x0, e.clientY-orbitDrag.y0);
    if(totalMoved > 6){
      /* This is a camera drag, not a click — a screen press that
         moves this far never enters focus. */
      downInfo = null;
      orbitDrag.orbiting = true;
      const dx = e.clientX - orbitDrag.lx, dy = e.clientY - orbitDrag.ly;
      orbitDrag.lx = e.clientX; orbitDrag.ly = e.clientY;
      orbitTheta -= dx * ORBIT_THETA_SPEED;
      orbitPhi = THREE.MathUtils.clamp(orbitPhi - dy * ORBIT_PHI_SPEED, ORBIT_PHI_MIN, ORBIT_PHI_MAX);
      applyOrbitToCamera();
      noteAzimuthSample(azimuthOf());
      renderer.domElement.style.cursor = "grabbing";
      return;
    }
  }
  // Unfocused hover affordance: hand cursor over any clickable screen.
  lastHoverXY = {clientX:e.clientX, clientY:e.clientY};
  if(!orbitDrag || !orbitDrag.orbiting)
    renderer.domElement.style.cursor =
      (!falling.isFinalDrop() && rayScreens(e)) ? "pointer" : "default";
});
renderer.domElement.addEventListener("pointerup", (e)=>{
  const wasOrbiting = orbitDrag && orbitDrag.orbiting;
  orbitDrag = null;
  if(!wasOrbiting) renderer.domElement.style.cursor = "default";
  if(focused){
    /* clicks while inside go to the device OS.
       The CRT runs the overlay page itself — only its physical
       power button is handled here. */
    if(focused === "crt"){
      setPtr(e); _ray.setFromCamera(_ptr, camera);
      if(_ray.intersectObject(crt.powerButton, false).length){ crt.togglePower(); return; }
      if(!crt.S.power){ crt.togglePower(); return; }
    }else if(focused === "laptop"){
      const c = lap.cursor;
      if(lap.windowOpen){
        if(lap.inClose(c.x,c.y)){ lap.handleVirtualClick(c.x,c.y); return; }
        if(lap.inTitle(c.x,c.y)){ return; }
        return;
      }
      lap.handleVirtualClick(c.x, c.y);
    }else if(focused === "tv"){
      setPtr(e); _ray.setFromCamera(_ptr, camera);
      if(_ray.intersectObject(tvd.powerDial, true).length){ tvd.togglePower(); }
    }
    lap.winDragging = false;
    return;
  }
  if(wasOrbiting){ downInfo = null; syncOrbitFromCamera(); return; }
  if(!downInfo) return;
  /* click (not drag) on a screen steps inside */
  if(Math.hypot(e.clientX-downInfo.x, e.clientY-downInfo.y) > 6){ downInfo = null; return; }
  if(downInfo.kind === "focus") enterFocus(downInfo.screen);
  downInfo = null;
});
renderer.domElement.addEventListener("pointercancel", (e)=>{
  downInfo = null;
  orbitDrag = null;
  lap.winDragging = false;
});
renderer.domElement.addEventListener("pointerleave", ()=>{
  lastHoverXY = null;
  orbitDrag = null;
  if(!focused) renderer.domElement.style.cursor = "default";
});
renderer.domElement.addEventListener("wheel", (e)=>{
  if(focused === "laptop" && lap.windowOpen){
    lap.scrollPdf(e.deltaY*.6);
    e.preventDefault();
  }
}, {passive:false});

/* DEBUG hooks (console only — no UI, no visuals): lets us verify the
   orbit counter and the release from DevTools / automated checks. */
window.__sculpture = {
  orbit(){
    return { theta: orbitTheta, phi: orbitPhi, radius: orbitRadius,
      coherent: coherentTotal, sectors: [...visitedSectors].sort(),
      dominant: dominantDir, completed: orbitCompleted,
      azimuth: azimuthOf(), focused, camTween: !!camTween };
  },
  physics(){
    return { finalDrop: falling.isFinalDrop(),
      bodies: falling.devices.map((d)=>({ name: d.name,
        spawned: d.spawned,
        y: d.body ? +d.body.translation().y.toFixed(3) : null,
        type: d.body ? d.body.bodyType() : null })) };
  },
  drop(){ if(!sculptureReady) finishIntro(); fireOrbitComplete(); return falling.isFinalDrop(); },
  intro(){ return { ready: sculptureReady, t: +introT.toFixed(3),
    flights: [...introMotions].map(([g, m]) => ({ y: +g.position.y.toFixed(2) })) }; },
};

/* ============================================================
   MAIN LOOP — controller steps physics, Three.js renders
   ============================================================ */
const clock = new THREE.Clock();
let hidden = false;
let staticAcc = 0;
let uiTick = 0;
let hoverTick = 0;
document.addEventListener("visibilitychange", ()=>{ hidden = document.hidden; });

/* Frame the sculpture on load: pull the orbit rig onto the composed
   trio so the opening view is intentional, not a leftover wide shot. */
syncOrbitFromCamera();
_tgt.copy(ORBIT_TGT);
prevAzimuth = azimuthOf();
visitedSectors.add(sectorOf(prevAzimuth));

function animate(){
  requestAnimationFrame(animate);
  if(hidden) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* Fall-in: hand-flown ballistic drop, then a hard freeze that hands
     the exact transforms to physics. */
  if(!sculptureReady){
    introT += dt;
    if(introT >= 0){
      const ft = Math.min(introT, INTRO_T);
      for (const [g, m] of introMotions){
        g.position.set(m.startP.x + m.vel.x * ft,
          m.startP.y + m.vel.y * ft + 0.5 * INTRO_G * ft * ft,
          m.startP.z + m.vel.z * ft);
        g.rotation.set(m.startR.x + m.ang.x * ft,
          m.startR.y + m.ang.y * ft, m.startR.z + m.ang.z * ft);
      }
      if(introT >= INTRO_T) finishIntro();
    }
  }

  falling.update(dt);
  crtEffect.update(dt);

  /* Hover affordance refresh: re-test periodically while orbiting. */
  hoverTick++;
  if(!focused && !camTween && hoverTick % 12 === 0 && lastHoverXY){
    if(!orbitDrag || !orbitDrag.orbiting)
      renderer.domElement.style.cursor =
        (!falling.isFinalDrop() && rayScreens(lastHoverXY)) ? "pointer" : "default";
  }

  /* camera flights (screen focus transitions) */
  if(camTween){
    camTween.t += dt/camTween.dur;
    const k = easeIO(Math.min(1, camTween.t));
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);
    _tgt.lerpVectors(camTween.t0, camTween.t1, k);
    /* Focus travel never counts toward the revolution. */
    prevAzimuth = azimuthOf();
    if(camTween.t >= 1){
      const done = camTween.done; camTween = null; done && done();
      if(!focused) { syncOrbitFromCamera(); prevAzimuth = azimuthOf(); }
    }
  } else if(!focused){
    /* Sculpture / void navigation: the rig already placed the camera
       on drag frames; holding still keeps it exactly where the viewer
       left it (which is what watches the machines fall away). */
    _tgt.copy(ORBIT_TGT);
    noteAzimuthSample(azimuthOf());
  }
  camera.lookAt(_tgt);

  /* screens stay alive.
     Canvas redraws run at half rate — the texture uploads are the
     most expensive per-frame work here, and 30Hz is invisible. */
  uiTick++;
  if(uiTick % 2 === 0){
    lap.drawOS();
  }
  lap.updateKeys();
  if(tvd.powered){
    staticAcc += dt;
    if(staticAcc > 0.07){ tvd.drawStatic(); staticAcc = 0; }
    tvd.screenMat.emissiveIntensity = 1.2 + Math.sin(performance.now()*0.016)*0.035;
  }

  /* the CRT belongs to the game page: overlay on while powered,
     canvas display stays dark glass behind it.
     Click-through until focused, playable once inside. */
  gameObj.visible = crt.S.power;
  gameDiv.style.pointerEvents = (focused === "crt") ? "auto" : "none";
  crt.display.visible = false;

  renderer.render(scene, camera);
  cssRenderer.render(scene, camera);
}
animate();

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  cssRenderer.setSize(innerWidth, innerHeight);
  if(focused){
    const m = focused==="crt" ? crt.display :
              focused==="laptop" ? lap.display : tvd.innerScreen;
    const w = focused==="crt" ? crt.screenW*CRT_S :
              focused==="laptop" ? lap.screenW*LAP_S : tvd.screenW*TV_S;
    const h = focused==="crt" ? crt.screenH*CRT_S :
              focused==="laptop" ? lap.screenH*LAP_S : tvd.screenH*TV_S;
    const pose = computeFocusPose(m, w, h);
    camera.position.copy(pose.pos); _tgt.copy(pose.tgt);
  }
});
</script>
</body>
</html>
