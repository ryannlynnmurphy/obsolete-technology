<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obsolete Technology — UFO</title>
<link rel="icon" href="data:," />
<style>
  /* Story controller: two separate cinematic chapters, one screen.
     No text, no chrome, no loader — only a black cut between them. */
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  iframe.stage{position:fixed;inset:0;width:100%;height:100%;border:0;
    display:block;background:#060708}
  #cut{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
    transition:opacity 1.2s ease;z-index:20}
  #cut.black{opacity:1}
  #scene-status{position:fixed;inset:0;display:grid;place-content:center;gap:12px;
    background:#000;color:rgba(245,245,238,.85);z-index:40;text-align:center;
    font:13px/1.6 system-ui,sans-serif;padding:24px}
  #scene-status button{background:#e8edf3;color:#0b0e13;border:0;border-radius:999px;
    padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="scene-status" role="status">Loading the signal…</div>
<div id="cut"></div>
<script>
/* ============================================================
   STORY CONTROLLER — plays one finished Three.js work, ends it
   cleanly, then presents the next finished Three.js work.

   CHAPTER ONE: scene-one.html (interactive obsolete-technology
     sculpture; ends itself on the genuine 360° release and posts
     { type: "scene-one-complete" } to this parent).
   CUT TO BLACK: fade out → hold pure black → destroy Scene 1.
   CHAPTER TWO: scene-two/index.html (cinematic UFO flyby, owns its
     own camera/renderer/loop; revealed from darkness).

   Each chapter lives in its own fullscreen iframe, so the two
   Three.js worlds never share state: removing the iframe destroys
   the render loop, renderer, physics, listeners and DOM in full.
   ============================================================ */

const STORY = {
  SCENE_ONE: "sceneOne",
  TRANSITION: "transition",
  SCENE_TWO: "sceneTwo"
};

/* Transition rhythm (ms). There is a genuine moment of BLACK
   between the chapters — that frame is punctuation, not loading. */
const FALL_READ_MS = 2200; // let Scene 1's final drop read before fading
const FADE_MS = 1200;      // Scene 1 fade out
const HOLD_MS = 1000;      // full black hold (minimum, before reveal)
const REVEAL_MS = 1000;    // Scene 2 reveal from darkness
const LOAD_FALLBACK_MS = 12000; // reveal anyway if Scene 2 is slow

let currentStoryState = STORY.SCENE_ONE;
let sceneOneComplete = false;
let activeScene = null; // the chapter iframe currently on screen
const cut = document.getElementById("cut");

/* Chapter watchdog: clears when Scene 1 boots (iframe load); offers
   retry on timeout without ever blocking a late boot. */
const sceneStatus = document.getElementById("scene-status");
const WATCHDOG_MS = Number(new URLSearchParams(location.search).get("watchdogMs")) || 25000;
const watchdogTimer = setTimeout(() => {
  if(!sceneStatus.parentNode) return;
  sceneStatus.innerHTML = "";
  const p = document.createElement("p");
  p.textContent = "This story couldn\u2019t start here. Try reloading or use a browser with WebGL enabled.";
  const b = document.createElement("button");
  b.textContent = "Retry";
  b.onclick = () => location.reload();
  sceneStatus.append(p, b);
}, WATCHDOG_MS);
function sceneBooted(){
  clearTimeout(watchdogTimer);
  if(sceneStatus.parentNode) sceneStatus.remove();
}

function makeStage(src){
  const frame = document.createElement("iframe");
  frame.className = "stage";
  frame.src = src;
  frame.allow = "fullscreen";
  document.body.insertBefore(frame, cut);
  return frame;
}

function loadSceneOne(){
  activeScene = makeStage("scene-one.html");
  activeScene.addEventListener("load", sceneBooted, { once: true });
}

function destroySceneOne(frame){
  /* Removing the iframe tears down everything Scene 1 owns: its
     requestAnimationFrame loop, WebGLRenderer, Rapier world, event
     listeners, CSS3D layer and nested overlay pages. */
  try{ frame.src = "about:blank"; }catch(e){}
  frame.remove();
  if(activeScene === frame) activeScene = null;
}

function loadSceneTwo(onReady){
  const frame = makeStage("scene-two/index.html");
  activeScene = frame;
  let settled = false;
  const ready = () => {
    if(settled) return;
    settled = true;
    onReady(frame);
  };
  frame.addEventListener("load", () => {
    /* The load event fires after the module executes; give the first
       frames a beat to exist behind the black before revealing. */
    setTimeout(ready, 400);
  });
  /* Reliability over precision: never sit on black forever. */
  setTimeout(ready, LOAD_FALLBACK_MS);
}

function setCut(black, durationMs){
  cut.style.transitionDuration = durationMs + "ms";
  cut.style.pointerEvents = black ? "auto" : "none";
  /* Force the duration to take before flipping the class. */
  void cut.offsetWidth;
  cut.classList.toggle("black", black);
}

function transitionToSceneTwo(){
  if(currentStoryState !== STORY.SCENE_ONE || !sceneOneComplete) return;
  currentStoryState = STORY.TRANSITION;
  const sceneOneFrame = activeScene;

  /* 1 — Scene 1 fades out from its final falling frame. */
  setCut(true, FADE_MS);

  setTimeout(() => {
    /* 2 — hold pure black. Scene 1 is fully destroyed here, unseen. */
    destroySceneOne(sceneOneFrame);
    const blackSince = performance.now();

    /* 3 — Scene 2 initializes behind the black with its own camera. */
    loadSceneTwo((frame) => {
      /* 4 — honor the minimum black hold, then reveal from darkness. */
      const remaining = Math.max(0, HOLD_MS - (performance.now() - blackSince));
      setTimeout(() => {
        currentStoryState = STORY.SCENE_TWO;
        setCut(false, REVEAL_MS);
        /* 5 — the UFO shot starts on reveal, not behind black: the rise
           into frame is the first thing seen after the machines drop. */
        try{ frame.contentWindow.postMessage({ type: "scene-two-start" }, "*"); }catch(e){}
      }, remaining);
    });
  }, FADE_MS);
}

window.addEventListener("message", (e) => {
  if(!e.data || e.data.type !== "scene-one-complete") return;
  if(activeScene && e.source !== activeScene.contentWindow) return;
  if(sceneOneComplete) return; // the ending fires exactly once
  sceneOneComplete = true;
  /* Let the release — the machines falling away — play out before
     the fade begins. That fall is the last shot of Chapter One. */
  setTimeout(transitionToSceneTwo, FALL_READ_MS);
});

loadSceneOne();
</script>
</body>
</html>
