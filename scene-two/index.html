<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060708;font-family:system-ui,sans-serif}

  #hud{display:none;position:fixed;left:18px;bottom:14px;color:rgba(255,255,255,.34);

  /* Final transmission — deadpan, no joke animation beyond a tiny
     signal-resolve. Same void black; text only. */
  #contact-screen{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s ease;z-index:30;
    font-family:"IBM Plex Mono",monospace;

  #contact-screen.visible{opacity:1;pointer-events:auto}
  .contact-content{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vh,18px);width:100%;max-height:100%;padding:12px;box-sizing:border-box;transform:translateY(-1vh)}
  .contact-title{
    position:relative;margin:0;font-size:clamp(18px,2vw,30px);font-weight:500;
    letter-spacing:.12em;line-height:1;color:rgba(245,245,238,.96);white-space:nowrap;opacity:0;
  }
  .contact-title.resolve{animation:signalResolve 900ms steps(1,end) forwards,subtleFlicker 4s 1.2s infinite}
  .contact-email{
    font-size:clamp(10px,.85vw,13px);font-weight:400;letter-spacing:.05em;
    color:rgba(225,225,218,.48);text-decoration:none;opacity:0;
    transition:color 180ms ease,opacity 600ms ease,text-shadow 180ms ease;
  }
  .contact-email.visible{opacity:1}
  .contact-email:hover{color:rgba(255,255,248,.95);text-shadow:-1px 0 rgba(255,255,255,.1),1px 0 rgba(255,255,255,.08)}
  .contact-author{margin:0;color:rgba(225,225,218,.48);font-size:clamp(9px,.72vw,11px);font-weight:400;letter-spacing:.2em;opacity:0;transition:opacity 600ms ease}
  .contact-author.visible{opacity:1}
  .contact-game{display:block;width:min(84vw,54vh,440px);height:min(84vw,54vh,440px);max-width:100%;flex:0 1 auto;border:1px solid rgba(225,225,218,.16);background:#030805;opacity:0;pointer-events:none;transition:opacity 700ms ease}
  .contact-game.visible{opacity:1;pointer-events:auto}
  .contact-title::before,.contact-title::after{
    content:attr(data-text);position:absolute;inset:0;opacity:0;pointer-events:none;
  }
  .contact-title.resolve::before{animation:ghostLeft 650ms steps(2,end)}
  .contact-title.resolve::after{animation:ghostRight 650ms steps(2,end)}
  @keyframes signalResolve{
    0%{opacity:0;filter:blur(5px);transform:translateX(-5px) scaleX(1.04)}
    9%{opacity:.15;filter:blur(2px);transform:translateX(7px) scaleX(.98)}
    17%{opacity:.7;filter:blur(1px);transform:translateX(-3px)}
    24%{opacity:.18;transform:translateX(4px)}
    32%{opacity:.85;transform:translateX(-1px)}
    45%{opacity:.38}
    58%{opacity:1;filter:blur(0);transform:none}
    100%{opacity:1;filter:none;transform:none}
  }
  @keyframes ghostLeft{
    0%{opacity:0}15%{opacity:.15;transform:translateX(-4px)}30%{opacity:0}
    44%{opacity:.09;transform:translateX(-2px)}100%{opacity:0}
  }
  @keyframes ghostRight{
    0%{opacity:0}18%{opacity:.12;transform:translateX(5px)}35%{opacity:0}
    48%{opacity:.07;transform:translateX(2px)}100%{opacity:0}
  }
  @keyframes subtleFlicker{0%,96%,100%{opacity:1}97%{opacity:.93}98%{opacity:1}}
  #scene-status{position:fixed;inset:0;display:grid;place-content:center;gap:12px;
    background:#060708;color:rgba(245,245,238,.85);z-index:60;text-align:center;
    font:13px/1.6 system-ui,sans-serif;padding:24px}
  #scene-status.failed button{background:#e8edf3;color:#0b0e13;border:0;border-radius:999px;
    padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

<script>
/* Boot watchdog: classic script, runs before any module import so a
   failed CDN import cannot silence it. Never tears down the scene —
   a late boot clears even the failure UI. Test hook: ?watchdogMs=. */
(function(){
  var status = document.getElementById("scene-status");
  var booted = false;
  var params = new URLSearchParams(location.search);
  var TIMEOUT = Number(params.get("watchdogMs")) || 25000;
  function showFail(msg){
    if(!document.getElementById("scene-status")){
      document.body.appendChild(status);
    }
    status.innerHTML = "";
    var p = document.createElement("p"); p.textContent = msg;
    var b = document.createElement("button"); b.textContent = "Retry";
    b.onclick = function(){ location.reload(); };
    status.appendChild(p); status.appendChild(b);
  }
  window.__sceneWatchdog = {
    ok: function(){
      booted = true; clearTimeout(timer);
      if(status.parentNode) status.remove();
    },
    fail: function(msg){ showFail(msg); }
  };
  try{
    var c = document.createElement("canvas");
    if(!c.getContext("webgl2") && !c.getContext("webgl")){
      showFail("This scene needs WebGL, which this browser has disabled. Try reloading or use a browser with WebGL enabled.");
      return;
    }
  }catch(e){
    showFail("This scene needs WebGL, which is unavailable here. Try reloading or use a browser with WebGL enabled.");
    return;
  }
  var timer = setTimeout(function(){
    if(!booted) showFail("This scene couldn\u2019t start here. Try reloading or use a browser with WebGL enabled.");
  }, TIMEOUT);
})();
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { buildUFO, EMITTER_BASE_OPACITY, WARM_BOUNCE_BASE, WARM_CORE_BASE, WARM_SIDE_BASE } from "./ufo.js";
import { buildAtmosphericBeam, setBeamPower, makeFogTexture } from "./beam.js";

/* Scene 2 — separate project from obsolete-technology/.
   Same black void (#060708). One scene, one camera, one renderer,
   one composer, one loop. The departure is sold by motion and
   perspective — no warp tunnel, no flash, no shake, no quantization. */

const DEBUG_UFO_PATH = false;

/* ---------- ONE scene / camera / renderer / composer / loop ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060708);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 2, 27);
const ORBIT_TGT = new THREE.Vector3(0.7, 2.4, 0); // optical center of the shot
camera.lookAt(ORBIT_TGT);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
/* Deliberate resolution: bloom amplifies pixel cost, so the UFO is
   the first place a lower mobile ratio is tested. Desktop unchanged. */
function renderPixelRatio(){
  const mobile = matchMedia("(max-width: 600px)").matches;
  return Math.min(window.devicePixelRatio || 1, mobile ? 1.25 : 2);
}
renderer.setPixelRatio(renderPixelRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
document.body.appendChild(renderer.domElement);
/* A lost GPU context cannot rebuild itself reliably — say so and offer reload. */
renderer.domElement.addEventListener("webglcontextlost", (e)=>{
  e.preventDefault();
  try{ window.__sceneWatchdog && window.__sceneWatchdog.fail(
    "The graphics context was lost. Reload to restore the signal."); }catch(_){}
});

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.16; // broad reflections describe the solid metal

// Near-black void lighting — the craft carries its own emission
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x0a0c10, 0.09));
const key = new THREE.DirectionalLight(0xffffff, 0.6);
key.position.set(4, 7, 5);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db8ff, 0.45);
rim.position.set(-5, 3.5, -6);
scene.add(rim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(ORBIT_TGT);
controls.enableDamping = true;
controls.enabled = false; // locked-off cinematic shot
controls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.25, 0.34, 0.92
);
composer.addPass(bloom);

/* ---------- ONE rigid flight system ---------- */
const ufoFlightRig = new THREE.Group();
const ufoVisual = new THREE.Group();
const beamAnchor = new THREE.Group();
ufoFlightRig.add(ufoVisual);
ufoFlightRig.add(beamAnchor);
scene.add(ufoFlightRig);

const { ufo, emitterMat, warmBounce, warmCore, warmSide } = buildUFO();
ufoVisual.add(ufo);

// Beam hangs from the recessed aperture (UFO-local Y ≈ -3.8, emitter disc).
beamAnchor.position.set(0, -3.85, 0.10);
const beam = buildAtmosphericBeam();
beamAnchor.add(beam.group);

// A soft local light sells the idea that the haze is illuminated from the craft.
const beamLight = new THREE.SpotLight(0xffe4bd, 3.2, 13.0, Math.PI * 0.24, 0.96, 1.75);
beamLight.position.set(0, -3.9, 0.2);
const beamTarget = new THREE.Object3D();
beamTarget.position.set(0, -12.0, 0.2);
ufoFlightRig.add(beamLight);
ufoFlightRig.add(beamTarget);
beamLight.target = beamTarget;

// Same on-screen size as the old craft: new hull radius ~16.8 raw needs
// total scale 0.575 to land on the approved ~9.7-unit world radius.
// Perspective does the rest.
const RIG_SCALE = 0.575;
ufoFlightRig.scale.setScalar(RIG_SCALE);

/* ---------- Departure axis: straight down the camera's look ray ---------- */
const centerRayDir = ORBIT_TGT.clone().sub(camera.position).normalize();
const centerRayDistanceNear = camera.position.distanceTo(ORBIT_TGT);
const launchNearPoint = camera.position.clone().addScaledVector(centerRayDir, centerRayDistanceNear);
const launchFarPoint = camera.position.clone().addScaledVector(centerRayDir, 215.0);
const launchPosition = new THREE.Vector3(); // reused — no per-frame allocation

// One extremely faint remnant at the departure point. It contracts rather
// than explodes, suggesting space briefly pinched and then shut.
const departureResidual = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeFogTexture(256),
  color: 0xffe4c2,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
}));
departureResidual.position.copy(ORBIT_TGT);
departureResidual.scale.set(0.01, 0.01, 1);
departureResidual.visible = false;
scene.add(departureResidual);

/* ---------- SCENE 2 TIMELINE ---------- */
// 0.00–1.10 : rises into frame
// 1.10–3.05 : heavy lateral sweep
// 3.05–3.75 : bends inward
// 3.75–4.85 : descends into exact optical center
// 4.85–5.45 : beam quietly dies (lower haze leads)
// 5.45–6.18 : absolute stillness — no hover, no shake, no charge VFX
// 6.18–6.55 : light subtly compresses inward
// 6.55–6.73 : continuous extreme acceleration straight into depth
// 6.73–7.20 : almost-invisible residual collapses, then black
const T_RISE_END = 1.10;
const T_SWEEP_END = 3.05;
const T_BEND_END = 3.75;
const T_ARRIVE = 4.85;
const T_BEAM_OFF = 5.45;
const T_CUE_END = 6.55;
const LAUNCH_START = 6.55;
const LAUNCH_DURATION = 0.18;
const T_RESIDUAL_END = 7.20;
const T_CUE_START = 6.18;

const approachPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-8.5, -10.0, 0.0),  // offscreen below-left (invisible start)
  new THREE.Vector3(-7.0,  -1.0, 2.0),  // rapid rise into frame, pushing toward lens
  new THREE.Vector3(-5.0,   5.5, 4.5),  // reaches upper frame, close pass
  new THREE.Vector3( 1.0,   5.0, 4.5),  // heavy sweep across the top, looming
  new THREE.Vector3( 7.0,   4.0, 4.0),  // far side of the sweep
  new THREE.Vector3( 4.5,   1.5, 2.0),  // smooth inward bend, settling back
  new THREE.Vector3( 2.0,   1.9, 0.8),  // converges toward center
  new THREE.Vector3( 0.7,   2.4, 0.0),  // exact optical center (== controls.target)
], false, "centripetal", 0.5);
const arrivalPosition = approachPath.getPointAt(1.0);

if (DEBUG_UFO_PATH) {
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(approachPath.getPoints(200)),
    new THREE.LineBasicMaterial({ color: 0x00ff88 })
  ));
}

function clamp01(v) { return Math.min(1, Math.max(0, v)); }
function smoothstep01(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
function easeOutCubic(v) { v = clamp01(v); return 1 - Math.pow(1 - v, 3); }
function easeInQuint(v) { v = clamp01(v); return v * v * v * v * v; }
function lerp(a, b, t) { return a + (b - a) * t; }

function approachProgress(t) {
  if (t <= 0) return 0;
  if (t < T_RISE_END) return lerp(0.00, 0.20, easeOutCubic(t / T_RISE_END));
  if (t < T_SWEEP_END) return lerp(0.20, 0.62, (t - T_RISE_END) / (T_SWEEP_END - T_RISE_END));
  if (t < T_BEND_END) return lerp(0.62, 0.79, smoothstep01((t - T_SWEEP_END) / (T_BEND_END - T_SWEEP_END)));
  if (t < T_ARRIVE) return lerp(0.79, 1.00, smoothstep01((t - T_BEND_END) / (T_ARRIVE - T_BEND_END)));
  return 1.0;
}

const replayBtn = document.getElementById("replay");
const statusEl = document.getElementById("status");
function setStatus(s) { if (statusEl) statusEl.textContent = s; }

const clock = new THREE.Clock();
let shotStart = null; // null = holding on the first frame behind black
let finished = false;

/* Covered-loop stop: one rAF owner. Once the opaque contact screen
   fully covers the canvas, frames stop; replay restarts them. */
let ufoFrameId = null;
let contactScreenCoversScene = false;
const ufoStats = { frames: 0, renders: 0 };
function scheduleUfo(){
  if(ufoFrameId === null) ufoFrameId = requestAnimationFrame(renderUfo);
}
function onContactScreenFullyOpaque(){
  contactScreenCoversScene = true;
  if(ufoFrameId !== null){ cancelAnimationFrame(ufoFrameId); ufoFrameId = null; }
}

function startShot(){
  shotStart = clock.getElapsedTime();
  finished = false;
  contactScreenCoversScene = false; // replay restarts the loop
  contactShown = false;
  contactScreen.classList.remove("visible");
  contactTitle.classList.remove("resolve");
  contactAuthor.classList.remove("visible");
  contactEmail.classList.remove("visible");
  contactGame.classList.remove("visible");
  contactGame.removeAttribute("src");
  ufoFlightRig.visible = true;
  beam.group.visible = true;
  controls.enabled = false;
  replayBtn.style.display = "none";
  setStatus("approach — rise");
  scheduleUfo();
}

/* Final transmission: deadpan MAKE CONTACT <3 + email, once the UFO is
   gone and the void is black again. */
const contactScreen = document.getElementById("contact-screen");
const contactTitle = contactScreen.querySelector(".contact-title");
const contactAuthor = contactScreen.querySelector(".contact-author");
const contactEmail = contactScreen.querySelector(".contact-email");
const contactGame = document.getElementById("signal-games");
let contactShown = false;
function showContactScreen(){
  if(contactShown) return;
  contactShown = true;
  contactScreen.classList.add("visible");
  contactGame.src = "./signal-games.html";
  /* Stop only when the screen is fully opaque (1.6s transition), not
     when the UFO leaves — the residual still needs its frames. */
  contactScreen.addEventListener("transitionend", function onOpaque(e){
    if(e.propertyName !== "opacity") return;
    if(!contactScreen.classList.contains("visible")) return;
    contactScreen.removeEventListener("transitionend", onOpaque);
    onContactScreenFullyOpaque();
  });
  setTimeout(() => {
    if(contactShown && contactScreen.classList.contains("visible"))
      onContactScreenFullyOpaque();
  }, 2600); // fallback if transitionend never fires
  setTimeout(() => { contactTitle.classList.add("resolve"); }, 1800);
  setTimeout(() => { contactAuthor.classList.add("visible"); }, 2600);
  setTimeout(() => { contactEmail.classList.add("visible"); }, 3300);
  setTimeout(() => { contactGame.classList.add("visible"); }, 3900);
}

/* Chapter mode (embedded in the story controller) waits for the parent's
   reveal: the UFO rise is the first thing seen after the machines drop.
   Standalone (opened directly) auto-plays as before. */
let isChapter = false;
try{ isChapter = window.self !== window.top; }catch(e){ isChapter = true; }
if(!isChapter) startShot();
window.addEventListener("message", (e) => {
  if(e && e.data && e.data.type === "scene-two-start") startShot();
});
/* Reliability: never sit on a frozen frame forever if the signal is missed. */
setTimeout(() => { if(shotStart === null) startShot(); }, 15000);
setStatus("approach — rise");

replayBtn.addEventListener("click", () => {
  startShot();
});

function renderUfo() {
  ufoFrameId = null;
  if(contactScreenCoversScene) return;
  ufoStats.frames++;
  const t = clock.getElapsedTime();
  const st = shotStart === null ? 0 : t - shotStart; // holding on frame 0 until reveal

  /* ----- beam: dies quietly once centered, lower haze leads ----- */
  const shutdown = smoothstep01((st - T_ARRIVE) / (T_BEAM_OFF - T_ARRIVE));
  const beamPower = 1.0 - shutdown;
  setBeamPower(beam, beamPower, t);
  beamLight.intensity = 0.8 * Math.pow(beamPower, 1.55);
  if (st >= T_BEAM_OFF + 0.4) beam.group.visible = false;

  /* ----- rig: approach, then pinned at center ----- */
  const p = approachProgress(st);
  ufoFlightRig.position.copy(approachPath.getPointAt(p));
  ufoFlightRig.rotation.set(0, 0, 0);

  // Small directional lean only while travelling; bled to zero on arrival.
  let bank = 0, pitch = 0;
  if (st < T_RISE_END) {
    bank = -0.024 * (1.0 - smoothstep01(st / T_RISE_END));
    pitch = -0.012;
  } else if (st < T_SWEEP_END) {
    bank = -0.010; pitch = -0.004;
  } else if (st < T_BEND_END) {
    bank = lerp(-0.010, 0.014, smoothstep01((st - T_SWEEP_END) / (T_BEND_END - T_SWEEP_END)));
  } else if (st < T_ARRIVE) {
    bank = lerp(0.014, 0.0, smoothstep01((st - T_BEND_END) / (T_ARRIVE - T_BEND_END)));
  }

  // Hover bled out before arrival; after arrival the craft is stone still.
  const arrivalLock = smoothstep01((st - (T_ARRIVE - 0.30)) / 0.30);
  const hoverAmount = 1.0 - arrivalLock;
  ufo.position.y = Math.sin(t * 0.34) * 0.018 * hoverAmount;
  ufo.rotation.x = pitch + Math.sin(t * 0.18) * 0.0022 * hoverAmount;
  ufo.rotation.z = -0.012 + bank + Math.sin(t * 0.13) * 0.0016 * hoverAmount;
  ufoVisual.rotation.set(0, 0, 0);
  beamAnchor.rotation.set(0, 0, 0);

  if (st >= T_ARRIVE && st < LAUNCH_START + LAUNCH_DURATION) {
    ufoFlightRig.position.copy(arrivalPosition);
    ufoFlightRig.rotation.set(0, 0, 0);
    ufo.position.y = 0;
    ufo.rotation.x = 0;
    ufo.rotation.z = -0.012;
  }

  /* ----- cue: light pulls inward, almost imperceptibly ----- */
  const compression = smoothstep01((st - T_CUE_START) / (T_CUE_END - T_CUE_START));
  const launch = clamp01((st - LAUNCH_START) / LAUNCH_DURATION);
  const launchDistance = easeInQuint(launch); // continuous — never quantized

  // Tiny warm pulse only during the first instant of motion.
  const departurePulse = smoothstep01(launch / 0.22) *
    (1.0 - smoothstep01((launch - 0.22) / 0.45));

  /* ----- departure: actual travel through depth, perspective does it ----- */
  if (launch > 0) {
    launchPosition.lerpVectors(launchNearPoint, launchFarPoint, launchDistance);
    ufoFlightRig.position.copy(launchPosition);
  }

  const perspectiveDim = 1.0 - 0.995 * smoothstep01(launchDistance);
  const compressionDim = 1.0 - compression * 0.22;
  const pulseBoost = 1.0 + departurePulse * 0.85;
  const glowBreath = Math.sin(t * 1.10) * 0.10 * (1.0 - arrivalLock);

  // Emitter + machine lights carry the same departure math the old engine
  // channel had: beam-coupled base, cue compression, perspective falloff,
  // and a whisper of a pulse at the instant of motion.
  const emitterBase = EMITTER_BASE_OPACITY * 0.6 + glowBreath * 0.02;
  emitterMat.opacity = Math.min(1, Math.max(
    0.02,
    emitterBase *
    (0.72 + beamPower * 0.16) *
    compressionDim * perspectiveDim * pulseBoost
  ));
  warmCore.intensity = WARM_CORE_BASE * 0.28 *
    (0.70 + beamPower * 0.14) *
    compressionDim * perspectiveDim * pulseBoost;
  warmBounce.intensity = WARM_BOUNCE_BASE * 0.28 *
    (0.70 + beamPower * 0.14) *
    compressionDim * perspectiveDim * pulseBoost;
  warmSide.intensity = Math.max(
    0.15,
    WARM_SIDE_BASE * 0.28 *
    (1.0 - compression * 0.10) * perspectiveDim
  );

  // Post stays quiet — a minuscule bloom lift, then gone with the craft.
  bloom.strength = 0.25 + 0.055 * departurePulse;

  /* ----- residual: barely-there contraction, then black ----- */
  if (st >= LAUNCH_START + 0.03 && st <= T_RESIDUAL_END) {
    const rp = clamp01((st - (LAUNCH_START + 0.03)) / (T_RESIDUAL_END - (LAUNCH_START + 0.03)));
    const appear = smoothstep01(rp / 0.16);
    const disappear = 1.0 - smoothstep01((rp - 0.18) / 0.82);
    const visibility = appear * disappear;
    const s = lerp(0.80, 0.10, smoothstep01(rp));
    departureResidual.visible = visibility > 0.001;
    departureResidual.material.opacity = 0.020 * visibility;
    departureResidual.scale.set(s, s, 1);
    departureResidual.position.copy(ORBIT_TGT);
  } else {
    departureResidual.visible = false;
    departureResidual.material.opacity = 0;
  }

  // Let perspective make it impossibly small, then remove before the far plane.
  ufoFlightRig.visible = launch < 0.985;
  if (launch >= 0.985) beam.group.visible = false;

  /* ----- HUD ----- */
  if (!finished) {
    if (st < T_RISE_END) setStatus("approach — rise");
    else if (st < T_SWEEP_END) setStatus("approach — sweep across");
    else if (st < T_BEND_END) setStatus("approach — curving inward");
    else if (st < T_ARRIVE) setStatus("approach — center descent");
    else if (st < T_BEAM_OFF) setStatus("beam dissipating");
    else if (st < T_CUE_START) setStatus("stillness");
    else if (st < LAUNCH_START) setStatus("something engages");
    else if (st < T_RESIDUAL_END) setStatus("—");
  }
  if (st > T_RESIDUAL_END + 0.3 && !finished) {
    finished = true;
    setStatus("complete — replay to watch again");
    /* The ending is the contact screen, not chrome: in chapter mode no
       replay pill, no orbit — just the transmission. Standalone keeps
       replay so the demo stays rewatchable. */
    if(isChapter){
      controls.enabled = false;
      replayBtn.style.display = "none";
    }else{
      controls.enabled = true;
      replayBtn.style.display = "block";
    }
    showContactScreen();
  }

  controls.update();
  const renderT0 = performance.now();
  composer.render();
  ufoStats.renders++;
  ufoStats.renderMs = (ufoStats.renderMs || 0) + (performance.now() - renderT0);
  scheduleUfo();
}
window.__ufo = { stats: ufoStats, get covered(){ return contactScreenCoversScene; } };
try{ window.__sceneWatchdog && window.__sceneWatchdog.ok(); }catch(_){}
scheduleUfo();

addEventListener("resize", () => {
  const ratio = renderPixelRatio();
  renderer.setPixelRatio(ratio);
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(ratio);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  /* A covered canvas needs exactly one fresh frame for the new size. */
  if(contactScreenCoversScene){ composer.render(); ufoStats.renders++; }
});
</script>
</body>
</html>
