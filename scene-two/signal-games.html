<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> </title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030805}body{display:grid;place-items:center}#game{display:block;width:min(100vw,100dvh);height:min(100vw,100dvh);touch-action:none;cursor:crosshair}</style></head><body><canvas id="game" aria-label="Three arcade games made of changing letters, numbers and symbols"></canvas><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d');let W=0,H=0,dpr=1,mode=0,phase='ready',ship,enemies=[],rocks=[],shots=[],enemyShots=[],bits=[],score=0,lives=3,wave=1,t=0,last=0,fireTimer=0,enemyTimer=0,inv=0,transition=0,modeTip=0,formationX=0,formationDir=1,formationStep=0,deathTimer=0;const keys=new Set(),names=['01 / FORMATION','02 / PURSUIT','03 / DRIFT'],glyphs='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/\\*+%#@?{}[]=~^|<>/\\*+%#@?{}[]=~^|<>/\\*+%#@?{}[]=~^|';const rand=(a,b)=>a+Math.random()*(b-a),pick=s=>s[(Math.random()*s.length)|0],wrap=(v,n)=>(v%n+n)%n,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let glyphCache=new Map(),lastGlyph=0;function char(id){if(!glyphCache.has(id))glyphCache.set(id,pick(glyphs));return glyphCache.get(id)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=H=Math.min(innerWidth,innerHeight);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);g.textBaseline='middle';g.textAlign='center';if(ship){ship.x=clamp(ship.x,20,W-20);ship.y=H*.82}}window.addEventListener('resize',resize);function label(str,x,y,size=14,color='#bfe7c4',align='center',alpha=1){g.save();g.globalAlpha=alpha;g.fillStyle=color;g.textAlign=align;g.font=`${size}px ui-monospace,SFMono-Regular,Consolas,monospace`;g.fillText(str,x,y);g.restore()}function glyph(id,x,y,size=17,color='#b7e7bb',alpha=1){label(char(id),x,y,size,color,'center',alpha)}function burst(x,y,count=18,color='#b9edbd'){for(let i=0;i<Math.max(1,Math.round(count*.12));i++)bits.push({x:x+rand(-15,15),y:y+rand(-15,15),vx:0,vy:0,life:rand(.32,.85),color,symbol:pick(glyphs),id:Math.random()})}function begin(n=mode){mode=n;phase='play';score=0;lives=3;wave=1;t=0;fireTimer=0;enemyTimer=.7;inv=2.2;formationX=0;formationDir=1;formationStep=0;shots=[];enemyShots=[];bits=[];ship={x:W/2,y:H*.82,vx:0,vy:0,a:-Math.PI/2};makeWave();modeTip=0;}function makeWave(){enemies=[];rocks=[];if(mode<2){const cols=Math.min(9,Math.max(5,Math.floor((W-48)/72))),rows=Math.min(4,Math.max(2,Math.floor(H/135)));const gap=Math.min(68,(W-55)/cols),start=(W-(cols-1)*gap)/2;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)enemies.push({x:start+col*gap,y:Math.max(75,H*.16)+r*48,hx:start+col*gap,hy:Math.max(75,H*.16)+r*48,row:r,col,dive:0,seed:rand(0,7),id:`${wave}-${r}-${col}`})}else for(let i=0;i<Math.min(3+wave,9);i++){let x,y;do{x=rand(30,W-30);y=rand(90,H-50)}while(Math.hypot(x-W/2,y-H*.82)<130);rocks.push(makeRock(x,y,3))}}function makeRock(x,y,size){let a=rand(0,Math.PI*2),v=rand(34,75)+(3-size)*28+wave*4;return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,size,rot:rand(0,7),spin:rand(-.65,.65),seed:rand(0,10000),id:Math.random()}}function fire(){if(phase==='ready'||phase==='over'){begin();return}if(phase==='pause'){phase='play';return}if(phase!=='play'||fireTimer>0)return;let a=mode===2?ship.a:-Math.PI/2;shots.push({x:ship.x+Math.cos(a)*18,y:ship.y+Math.sin(a)*18,vx:(mode===2?ship.vx:0)+Math.cos(a)*(mode===2?580:0),vy:(mode===2?ship.vy:0)+Math.sin(a)*580,life:mode===2?1.0:1.6,id:Math.random()});fireTimer=mode===2?.17:.21}function hurt(){if(inv>0||phase!=='play')return;burst(ship.x,ship.y,32,'#e5aa83');lives--;inv=2;if(lives<=0){phase='over';deathTimer=0;return}ship.x=W/2;ship.y=H*.82;ship.vx=ship.vy=0}function dist(a,b){let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);return Math.hypot(mode===2?Math.min(dx,W-dx):dx,mode===2?Math.min(dy,H-dy):dy)}function killEnemy(i){let e=enemies.splice(i,1)[0];score+=(4-e.row)*10;burst(e.x,e.y,16);if(!enemies.length){wave++;makeWave();inv=Math.max(inv,1)}}function killRock(i){let r=rocks.splice(i,1)[0];score+=r.size===3?20:r.size===2?50:100;burst(r.x,r.y,r.size*9);if(r.size>1)for(let j=0;j<2;j++){let child=makeRock(r.x,r.y,r.size-1);child.vx+=(j?1:-1)*60;child.vy+=(j?-1:1)*55;rocks.push(child)}if(!rocks.length){wave++;makeWave();inv=Math.max(inv,1)}}function update(dt){t+=dt;transition=Math.max(0,transition-dt);for(let i=bits.length-1;i>=0;i--){let b=bits[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0)bits.splice(i,1)}if(phase==='over'){deathTimer+=dt;if(deathTimer>1.5)begin(mode);return}if(phase!=='play')return;inv=Math.max(0,inv-dt);fireTimer=Math.max(0,fireTimer-dt);if(keys.has('fire'))fire();let axis=Number(keys.has('right'))-Number(keys.has('left'));if(mode===2){ship.a+=axis*4.1*dt;if(keys.has('thrust')){ship.vx+=Math.cos(ship.a)*290*dt;ship.vy+=Math.sin(ship.a)*290*dt}ship.vx*=Math.pow(.996,dt*60);ship.vy*=Math.pow(.996,dt*60);ship.x=wrap(ship.x+ship.vx*dt,W);ship.y=wrap(ship.y+ship.vy*dt,H)}else ship.x=clamp(ship.x+axis*340*dt,24,W-24);for(let i=shots.length-1;i>=0;i--){let b=shots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(mode===2){b.x=wrap(b.x,W);b.y=wrap(b.y,H)}if(b.life<=0||mode!==2&&(b.y<0||b.x<0||b.x>W)){shots.splice(i,1);continue}let j=mode===2?rocks.findIndex(r=>dist(b,r)<r.size*18):enemies.findIndex(e=>dist(b,e)<19);if(j>=0){shots.splice(i,1);mode===2?killRock(j):killEnemy(j)}}if(mode===2){for(let r of rocks){r.x=wrap(r.x+r.vx*dt,W);r.y=wrap(r.y+r.vy*dt,H);r.rot+=r.spin*dt;if(dist(ship,r)<r.size*17+11)hurt()}}else{if(mode===0){formationX+=formationDir*(25+wave*6)*dt;let min=Math.min(...enemies.map(e=>e.hx+formationX)),max=Math.max(...enemies.map(e=>e.hx+formationX));if(min<29||max>W-29){formationDir*=-1;formationStep+=11;formationX+=formationDir*4}for(let e of enemies){e.x=e.hx+formationX;e.y=e.hy+formationStep}}else for(let e of enemies){if(e.dive>0){e.dive+=dt;let u=e.dive;e.x=e.hx+Math.sin(u*4+e.seed)*Math.min(200,u*130);e.y=e.hy+u*195;if(e.y>H+30){e.dive=0;e.x=e.hx;e.y=e.hy}}else{e.x=e.hx+Math.sin(t*.8)*25;e.y=e.hy+Math.sin(t*1.5+e.seed)*3}}if(mode===1&&Math.random()<dt*(.35+wave*.03)){let resting=enemies.filter(e=>!e.dive);if(resting.length)resting[Math.floor(Math.random()*resting.length)].dive=.001}enemyTimer-=dt;if(enemyTimer<=0&&enemies.length){let e=enemies[Math.floor(Math.random()*enemies.length)];enemyShots.push({x:e.x,y:e.y+17,vy:200+wave*13,id:Math.random()});enemyTimer=rand(.45,1.25)*Math.max(.5,1-wave*.05)}for(let i=enemyShots.length-1;i>=0;i--){let b=enemyShots[i];b.y+=b.vy*dt;if(b.y>H){enemyShots.splice(i,1);continue}if(dist(ship,b)<15){enemyShots.splice(i,1);hurt()}}for(let e of enemies){if(dist(ship,e)<24)hurt();if(e.y>H*.84){phase='over';deathTimer=0;break}}}}
function reception(x,y){let fx=W*(.37+.16*Math.sin(t*.17)),fy=H*(.43+.13*Math.sin(t*.13+1));return clamp(1-Math.hypot((x-fx)/(W*.29),(y-fy)/(H*.33)),0,1)}
function held(entity){if(!entity)return null;let strength=reception(entity.x,entity.y);if(entity.nextHold===undefined)entity.nextHold=t+rand(.4,2.2);if(entity.hold&&t>=entity.hold.until)entity.hold=null;if(strength>.23&&t>=entity.nextHold){entity.hold={x:entity.x,y:entity.y,until:t+rand(.26,.55),side:Math.random()<.5?0:1,chars:new Map()};entity.nextHold=t+rand(2,3.7)}return entity.hold||null}
function drawShape(cx,cy,pattern,scale,prefix,color,entity){let rows=pattern.length,cols=Math.max(...pattern.map(s=>s.length)),hold=held(entity),weak=reception(cx,cy);for(let r=0;r<rows;r++)for(let col=0;col<pattern[r].length;col++)if(pattern[r][col]!==' '){let paused=hold&&Number(col>=cols/2)===hold.side,px=paused?hold.x:cx,py=paused?hold.y:cy;let xx=px+(col-(cols-1)/2)*scale,yy=py+(r-(rows-1)/2)*scale,id=prefix+'-'+r+'-'+col;if(weak>.45&&((r*11+col*7+Math.floor(t*5))%13===0))continue;if(paused){if(!hold.chars.has(id))hold.chars.set(id,pick(glyphs));label(hold.chars.get(id),xx,yy,scale*1.15,color)}else glyph(id,xx,yy,scale*1.15,color)}}const enemyPatterns=[['  x  ',' xxx ','xxxxx','x x x'],[' x x ','xxxxx',' xxx ','x x x'],[' xxx ','xxxxx','x x x',' x x '],['  x  ',' xxx ','xxxxx',' x x ']];const shipPattern=['  x  ',' xxx ','xxxxx','x   x'];function drawShip(){if(!ship||inv>0&&Math.floor(t*10)%2)return;g.save();g.translate(ship.x,ship.y);if(mode===2)g.rotate(ship.a+Math.PI/2);drawShape(0,0,shipPattern,7,'ship','#d9f6db');g.restore()}function drawRock(r){let count=10,R=r.size*16,hold=held(r),weak=reception(r.x,r.y);for(let i=0;i<count;i++){let angle=i/count*Math.PI*2+r.rot,variation=.78+.2*Math.sin(i*13.2+r.seed),paused=hold&&Number(i>=count/2)===hold.side,px=paused?hold.x:r.x,py=paused?hold.y:r.y,x=px+Math.cos(angle)*R*variation,y=py+Math.sin(angle)*R*variation,id=`rock-${r.id}-${i}`;if(weak>.48&&(i+Math.floor(t*5))%11===0)continue;if(paused){if(!hold.chars.has(id))hold.chars.set(id,pick(glyphs));label(hold.chars.get(id),x,y,clamp(9+r.size*2,10,15),'#b6d5b9')}else glyph(id,x,y,clamp(9+r.size*2,10,15),'#b6d5b9')}if(r.size>1)for(let j=0;j<r.size*2;j++){let a=j*2.4+r.rot/2;glyph(`core-${r.id}-${j}`,r.x+Math.cos(a)*R*.4,r.y+Math.sin(a)*R*.4,11,'#668a6b')}}function draw(){g.fillStyle='#030805';g.fillRect(0,0,W,H);for(let i=0;i<Math.min(45,W*H/18000);i++){let x=(i*197.23)%W,y=(i*131.73)%H;label(char('noise'+i),x,y,9,'#294c32','center',.25)}if(mode===2){for(let r of rocks)drawRock(r)}else for(let e of enemies)drawShape(e.x,e.y,enemyPatterns[e.row%4],6.4,'e'+e.id,e.row===0?'#d0c096':'#a7ddb0',e);for(let b of shots)glyph('s'+b.id,b.x,b.y,17,'#e0eac1');for(let b of enemyShots)glyph('z'+b.id,b.x,b.y,16,'#dba887');for(let b of bits)label(b.symbol,b.x,b.y,12,b.color,'center',clamp(b.life*1.6,0,.65));drawShip();if(phase==='over'){g.fillStyle='rgba(3,8,5,.65)';g.fillRect(0,0,W,H)}}function frame(now){let dt=Math.min((now-last)/1000||0,.04);last=now;if(now-lastGlyph>=1000/48){glyphCache.clear();lastGlyph=now}update(dt);draw();requestAnimationFrame(frame)}function switchMode(n){if(n===mode)return;begin(n);transition=.5}const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'thrust',a:'left',d:'right',w:'thrust',' ':'fire'};window.addEventListener('keydown',e=>{if('123'.includes(e.key)&&e.key.length===1){switchMode(Number(e.key)-1);return}if(e.key==='p'||e.key==='P'){if(phase==='play')phase='pause';else if(phase==='pause')phase='play';return}if(e.key==='Tab'){e.preventDefault();switchMode((mode+1)%3);return}let k=map[e.key];if(k){e.preventDefault();keys.add(k);if(k==='fire'&&phase!=='play')fire()}});window.addEventListener('keyup',e=>{let k=map[e.key];if(k)keys.delete(k)});window.addEventListener('blur',()=>{keys.clear();if(phase==='play')phase='pause'});let swipeX=null;c.addEventListener('pointerdown',e=>{swipeX=e.clientX;if(e.clientY<65&&e.clientX>W*.3&&e.clientX<W*.7){switchMode((mode+1)%3);swipeX=null;return}if(phase!=='play')fire()});c.addEventListener('pointerup',e=>{if(swipeX!==null&&Math.abs(e.clientX-swipeX)>65)switchMode((mode+(e.clientX<swipeX?1:2))%3);swipeX=null});resize();begin(0);requestAnimationFrame(frame)})();
</script></body></html>
